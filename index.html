<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>星光公主大冒險</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#121A44">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="星光公主">

<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preload" as="font" type="font/woff2" href="font-hun-c7a61c14.woff2" crossorigin>
<style>@font-face{font-family:"Huninn";src:url(font-hun-c7a61c14.woff2) format("woff2");font-weight:400;font-display:swap}@font-face{font-family:"Baloo 2";src:url(font-baloo-abc191e4.woff2) format("woff2");font-weight:400 800;font-display:swap}</style>
<style>
[hidden]{display:none!important}
:root{
  --sky1:#121A44; --sky2:#2A2466; --sky3:#4A3282;
  --glass:rgba(38,32,94,.72); --glass2:rgba(24,20,70,.55);
  --gold:#FFD98A; --gold2:#FFC24D; --goldline:rgba(255,217,138,.7);
  --text:#FFF8EC; --text2:#D4CCF4; --deep:#2A2266;
  --cjk:"Huninn","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  --latin:"Baloo 2","Arial Rounded MT Bold","Nunito",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0}
body{background:linear-gradient(180deg,var(--sky1),var(--sky2) 60%,var(--sky3));color:var(--text);font-family:var(--cjk);overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:manipulation}
#sky{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
#sky svg{position:absolute;inset:0;width:100%;height:100%}
.twl{position:absolute;inset:0;will-change:opacity;animation:twl 3.2s ease-in-out infinite}.twl.b{animation-duration:4.1s;animation-delay:1.3s}
@keyframes twl{50%{opacity:.2}}
.lite .twl{animation:none}
.shoot{position:absolute;top:12%;left:70%;width:140px;height:2px;background:linear-gradient(90deg,rgba(255,255,255,0),#fff);border-radius:2px;opacity:0;transform:rotate(-24deg);animation:shoot 11s linear infinite 3s}
@keyframes shoot{0%{opacity:0;transform:translate(0,0) rotate(-24deg)}2%{opacity:1}8%{opacity:0;transform:translate(-420px,190px) rotate(-24deg)}100%{opacity:0}}
#app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;max-width:1120px;margin:0 auto;padding-inline:16px;padding-block:10px;box-sizing:border-box;gap:10px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;touch-action:manipulation}
button:focus-visible,.node:focus-visible{outline:3px solid var(--gold);outline-offset:3px}

/* top bar */
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px}
.gems{display:flex;align-items:center;gap:3px;background:var(--glass);border:2px solid var(--goldline);border-radius:999px;padding:4px 12px}
.gems svg{width:28px;height:28px}
.icons{display:flex;gap:8px}
.ibtn{width:46px;height:46px;border-radius:50%;background:var(--glass);border:2px solid var(--goldline);display:grid;place-items:center}
.ibtn svg{width:22px;height:22px}
.ibtn.off{opacity:.5}
@media (max-width:480px){.gems{padding:3px 8px;gap:1px}.gems svg{width:22px;height:22px}.ibtn{width:40px;height:40px}.icons{gap:5px}}

#screen{flex:1;min-height:0;position:relative;transition:opacity .26s ease,transform .26s ease}
#screen.out{opacity:0;transform:scale(.96)}
#screen.in{animation:scIn .5s ease}
@keyframes scIn{from{opacity:0;transform:scale(1.04)}}

/* buttons */
.btn{background:linear-gradient(180deg,#FFF0B8,#FFC24D);color:#3A2A6A;font-size:clamp(22px,3.2vw,30px);padding:.32em 1.4em .38em;border-radius:999px;box-shadow:0 6px 0 #B97A1A,0 0 26px rgba(255,200,80,.45);letter-spacing:.12em}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #B97A1A,0 0 26px rgba(255,200,80,.45)}
.btn2{background:var(--glass);border:2px solid var(--goldline);color:var(--text);font-size:clamp(19px,2.6vw,24px);padding:.3em 1.2em .36em;border-radius:999px;box-shadow:0 5px 0 rgba(0,0,0,.3);letter-spacing:.1em}
.btn2:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.3)}
.lab{font-size:15px;color:var(--text2);letter-spacing:.08em}
.seg{display:inline-flex;border:2px solid var(--goldline);border-radius:999px;overflow:hidden;margin-top:8px;background:var(--glass2)}
.seg button{padding:8px 18px;font-size:16px;color:var(--text2)}
.seg button[aria-pressed="true"]{background:var(--gold);color:var(--deep)}
.vrow{display:flex;gap:10px;align-items:center;margin-top:8px;flex-wrap:wrap}
.vsel{appearance:none;-webkit-appearance:none;background:var(--glass2);color:var(--text);border:2px solid var(--goldline);border-radius:999px;padding:8px 16px;font:inherit;font-size:15px;max-width:240px}
.btn2.small{font-size:16px;padding:.3em 1em}

/* title */
.title{height:100%;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);align-items:center;gap:20px}
.art{position:relative;display:flex;align-items:flex-end;justify-content:center;height:min(66vh,480px)}
.art::after{content:"";position:absolute;bottom:-2%;left:15%;right:15%;height:12%;border-radius:50%;background:radial-gradient(closest-side,rgba(255,220,140,.35),transparent);z-index:-1}
.art .pr{height:100%;width:auto}
.art .uni{height:52%;width:auto;margin-right:-6%}
.panel{display:flex;flex-direction:column;gap:20px;align-items:flex-start}
h1{margin:0;white-space:nowrap;font-size:clamp(40px,6.6vw,74px);letter-spacing:.06em;line-height:1.15;font-weight:400;background:linear-gradient(180deg,#FFF6CC,#FFC24D);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 14px rgba(255,200,90,.45))}
.sub{font-size:clamp(17px,2.3vw,21px);margin:.4em 0 0;color:var(--text2);line-height:1.6}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
@media (max-width:720px),(orientation:portrait) and (max-width:1100px){.title{grid-template-columns:minmax(0,1fr);align-content:center;gap:8px}.art{height:34vh}.panel{align-items:center;text-align:center;gap:14px}.row{justify-content:center}}
@media (orientation:portrait) and (min-width:721px) and (max-width:1100px){.art{height:42vh}}

/* wardrobe */
.ward{height:100%;display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:18px;align-items:stretch}
.stagebox{position:relative;border-radius:28px;background:radial-gradient(ellipse at 50% 90%,rgba(255,220,140,.28),transparent 55%),var(--glass2);border:2px solid var(--goldline);display:flex;align-items:flex-end;justify-content:center;padding:10px;overflow:hidden;min-height:0}
.stagebox .pr{height:96%;width:auto;max-width:100%}
.stagebox .pr.spin{animation:spin .7s ease}
@keyframes spin{40%{transform:scale(1.06) rotate(-4deg)}70%{transform:scale(.98) rotate(3deg)}}
.closet{display:flex;flex-direction:column;gap:12px;min-height:0}
.closet h2{margin:0;font-size:clamp(24px,3.4vw,32px);font-weight:400;color:var(--gold)}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{padding:8px 16px;border-radius:999px;border:2px solid var(--goldline);background:var(--glass2);font-size:18px;color:var(--text2)}
.tab[aria-selected="true"]{background:var(--gold);color:var(--deep)}
.opts{flex:1;min-height:0;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;align-content:start;padding:2px}
.opt{border-radius:20px;background:var(--glass);border:2px solid rgba(255,255,255,.15);padding:8px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:4px}
.opt svg{width:100%;height:auto;aspect-ratio:1;display:block}
.opt span{font-size:15px;color:var(--text2)}
.opt[aria-pressed="true"]{border-color:var(--gold);box-shadow:0 0 18px rgba(255,210,110,.45)}
.opt[aria-pressed="true"] span{color:var(--gold)}
@media (max-width:720px){.ward{grid-template-columns:1fr;grid-template-rows:34% 1fr;gap:10px}.opts{grid-template-columns:repeat(auto-fill,minmax(92px,1fr))}}

/* map */
.map{height:100%;display:flex;flex-direction:column;gap:6px}
.mapsvg{flex:1;min-height:0;width:100%;overflow:hidden;border-radius:24px}
.maprow{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap}
.maptip{margin:0;font-size:clamp(17px,2.4vw,22px);color:var(--text2)}
.maprow .btn2{font-size:17px;padding:.25em 1em .3em}
.node{cursor:pointer;outline:none}
.node.locked{cursor:default}
.node.locked .nbody{opacity:.4}
.nlab{font-family:var(--cjk);font-size:32px;fill:var(--text);stroke:#1A1648;stroke-width:8px;paint-order:stroke;stroke-linejoin:round}
.ring{transform-box:fill-box;transform-origin:center;animation:pulse 1.5s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(1.2);opacity:.2}}
.trail{animation:trail 1.4s linear infinite}
@keyframes trail{to{stroke-dashoffset:-42}}

/* stage */
.stage{height:100%;display:flex;flex-direction:column;border-radius:28px;border:2px solid var(--goldline);background:rgba(24,20,70,.45);position:relative;overflow:hidden;padding:12px 14px;box-sizing:border-box;gap:8px}
.decor{position:absolute;left:0;bottom:0;width:100%;height:34%;pointer-events:none}
.talk{display:flex;align-items:center;gap:18px;position:relative;z-index:1}
.helper{width:clamp(64px,10vw,96px);flex:none;animation:hop 2.4s ease-in-out infinite}
.helper svg{width:100%;height:auto;display:block}
.helper.huh{animation:huh .7s ease}
@keyframes hop{0%,70%,100%{transform:translateY(0)}80%{transform:translateY(-10px)}90%{transform:translateY(0)}}
@keyframes huh{30%{transform:rotate(-12deg)}60%{transform:rotate(8deg)}}
.bubble{flex:1;background:var(--glass);border:2px solid var(--goldline);border-radius:26px;padding:8px 10px 8px 18px;display:flex;align-items:center;gap:12px;position:relative;min-height:64px;animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
.bubble::before{content:"";position:absolute;left:-15px;top:50%;margin-top:-9px;border:9px solid transparent;border-right:14px solid var(--goldline);border-left:0}
.prompt{flex:1;margin:0;font-size:clamp(20px,3vw,28px);line-height:1.4}
.prompt b.ear{display:inline-grid;place-items:center;width:1.25em;height:1.25em;border-radius:50%;background:rgba(255,217,138,.15);border:2px dashed var(--goldline);font-size:1.1em;vertical-align:-.25em;padding-top:.08em;box-sizing:border-box}
.prompt b.kw{font-family:var(--cjk);font-weight:400;font-size:1em;vertical-align:0}
.prompt b{font-family:var(--latin);font-weight:800;font-size:1.45em;color:var(--gold2);line-height:1;vertical-align:-.08em;text-shadow:0 0 12px rgba(255,200,80,.6)}
.speak{width:54px;height:54px;border-radius:50%;background:linear-gradient(180deg,#FFF0B8,#FFC24D);display:grid;place-items:center;flex:none;box-shadow:0 0 16px rgba(255,200,80,.5)}
.speak svg{width:26px;height:26px}
.play{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(12px,3vh,26px);position:relative;z-index:1}
.cast{display:flex;align-items:flex-end;justify-content:space-between;position:relative;z-index:1;height:clamp(84px,19vh,168px)}
.qdots{display:flex;gap:8px;align-self:center}
.qdots i{width:18px;height:18px;border-radius:50%;border:2px solid var(--gold);background:transparent;transition:background .3s,box-shadow .3s}
.qdots i.on{background:var(--gold2);box-shadow:0 0 12px var(--gold2)}
.team{display:flex;align-items:flex-end;height:100%}
.team .pr{height:100%;width:auto}
.team{position:relative}
.pet{height:62%;display:flex;align-items:flex-end;margin-right:-8px}
.pet .uni{height:100%;width:auto}
.pet.petjump{animation:petjump .7s ease}
@keyframes petjump{30%{transform:translateY(-18px) rotate(-6deg)}60%{transform:translateY(0)}75%{transform:translateY(-6px)}}
.team.cast-on .pr{animation:castjump .6s ease}
@keyframes castjump{35%{transform:translateY(-14px) rotate(-3deg)}}

/* tiles */
.tiles{display:flex;gap:clamp(12px,3vw,26px);flex-wrap:wrap;justify-content:center}
.tile{width:clamp(76px,14.5vw,116px);aspect-ratio:1;max-width:100%;border-radius:26px;border:2px solid rgba(255,255,255,.75);font-family:var(--latin);font-weight:800;font-size:clamp(42px,8vw,68px);color:#fff;display:grid;place-items:center;line-height:1;padding-top:.1em;box-sizing:border-box;background:linear-gradient(160deg,var(--t1),var(--t2) 72%);box-shadow:0 6px 0 rgba(0,0,0,.3),0 0 22px var(--t2);text-shadow:0 2px 0 rgba(0,0,0,.22);animation:pop .45s cubic-bezier(.3,1.6,.5,1) backwards;animation-delay:var(--dl,0s)}
.tile:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.3),0 0 22px var(--t2)}
.c0{--t1:#FFC2E0;--t2:#FF5FA6}.c1{--t1:#B8F4FB;--t2:#22B3D2}.c2{--t1:#DDCFFF;--t2:#8563EE}.c3{--t1:#FFF2B0;--t2:#F0A92A}.c4{--t1:#BDF7D8;--t2:#2DBF80}
.tile.gone{visibility:hidden}

/* butterflies */
.flutter{display:flex;gap:clamp(4px,3vw,32px);flex-wrap:wrap;justify-content:center}
.bfly{position:relative;width:clamp(92px,19vw,160px);aspect-ratio:1.1;animation:flyin 1s cubic-bezier(.2,.8,.3,1) backwards;animation-delay:var(--dl)}
@keyframes flyin{from{transform:translate(var(--fx),var(--fy)) rotate(var(--fr)) scale(.4);opacity:0}}
.bfly .fl{position:absolute;inset:0;animation:float 2.8s ease-in-out infinite;animation-delay:var(--dl)}
@keyframes float{50%{transform:translateY(-12px) rotate(2deg)}}
.bfly svg{width:100%;height:100%;display:block;filter:drop-shadow(0 0 10px var(--w))}
.bfly span{position:absolute;left:50%;top:54%;transform:translate(-50%,-50%);width:48%;aspect-ratio:1;border-radius:50%;background:#FFFDF5;display:grid;place-items:center;font-family:var(--latin);font-weight:800;font-size:clamp(34px,6.4vw,58px);line-height:1;padding-top:.12em;box-sizing:border-box;color:var(--deep);box-shadow:0 0 14px rgba(255,255,255,.6)}
.bfly.win .fl{animation:winfly 1.2s ease forwards}
@keyframes winfly{30%{transform:scale(1.25)}100%{transform:translateY(-30px) scale(1.15)}}

/* countable items */
.riverwrap{position:relative;width:100%;max-width:840px;padding-inline:58px;box-sizing:border-box}
.river{border-radius:36px;padding:clamp(14px,3vh,26px) 12px;background:linear-gradient(180deg,#3148A8,#23307E);border:2px solid rgba(160,220,255,.45);box-shadow:inset 0 0 30px rgba(120,200,255,.25);position:relative;overflow:hidden}
.river::before{content:"";position:absolute;inset:-50% -10%;background:repeating-linear-gradient(170deg,transparent 0 26px,rgba(170,230,255,.12) 26px 30px);animation:flow 5s linear infinite}
@keyframes flow{to{transform:translateX(60px)}}
.frog{position:absolute;left:0;top:50%;width:56px;margin-top:-28px;z-index:2}
.frog svg{width:100%;height:auto;display:block}
.bank{position:absolute;right:4px;top:50%;margin-top:-18px;width:44px;height:36px;border-radius:50%;background:radial-gradient(#6DD38E,#2E8F5A);box-shadow:0 0 12px rgba(120,240,160,.5)}
.items{display:flex;flex-wrap:wrap;justify-content:center;gap:clamp(6px,1.4vw,14px);position:relative}
.it{position:relative;width:clamp(46px,8.5vw,74px);aspect-ratio:1;transition:transform .2s,opacity .6s,filter .6s}
.it svg{width:100%;height:100%;display:block}
.it.counted{transform:scale(1.12);filter:drop-shadow(0 0 10px #FFF3B0)}
.it[data-n]::after{content:attr(data-n);position:absolute;top:-8px;right:-8px;background:var(--gold2);color:var(--deep);font-family:var(--latin);font-weight:800;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:16px;line-height:1;padding-top:3px;box-sizing:border-box}
.drop{animation:drop .6s cubic-bezier(.3,1.4,.5,1) backwards;animation-delay:var(--dl)}
@keyframes drop{from{transform:translateY(-70px) scale(.6);opacity:0}}
.grow{animation:grow .6s cubic-bezier(.3,1.6,.5,1) backwards;animation-delay:var(--dl);transform-origin:50% 100%}
@keyframes grow{from{transform:scale(0)}}
.floatin{animation:floatin .9s cubic-bezier(.2,.9,.3,1.2) backwards;animation-delay:var(--dl)}
@keyframes floatin{from{transform:translate(120px,-60px) rotate(40deg) scale(.4);opacity:0}}
.dance{animation:dance2 .5s ease-in-out infinite alternate}
@keyframes dance2{to{transform:translateY(-6px) rotate(6deg)}}
.it.bite{animation:bite .7s ease forwards;pointer-events:none}
@keyframes bite{20%{transform:rotate(-12deg) scale(1.05)}40%{transform:rotate(10deg)}100%{transform:scale(.7);opacity:.2;filter:grayscale(1)}}
.hang{animation:hang 2.6s ease-in-out infinite;transform-origin:50% 0;animation-delay:var(--dl)}
@keyframes hang{50%{transform:rotate(5deg)}}

.eq{display:flex;align-items:center;justify-content:center;gap:clamp(8px,2vw,18px);flex-wrap:wrap}
.grp{background:var(--glass);border:2px solid var(--goldline);border-radius:26px;padding:10px 12px;display:flex;flex-direction:column;align-items:center;gap:6px}
.grp .items{max-width:clamp(130px,30vw,300px)}
.grp .it{width:clamp(36px,6vw,54px)}
.grp em{font-style:normal;font-family:var(--latin);font-weight:800;font-size:clamp(30px,5vw,44px);line-height:1;color:var(--gold)}
.op{font-family:var(--latin);font-size:clamp(40px,6vw,60px);font-weight:800;line-height:1;color:var(--text)}
.qbox{width:clamp(70px,12vw,100px);aspect-ratio:1;border:3px dashed var(--goldline);border-radius:24px;display:grid;place-items:center;font-family:var(--latin);font-weight:800;font-size:clamp(40px,7vw,64px);background:var(--glass2);line-height:1;padding-top:.1em;box-sizing:border-box;color:var(--gold)}
.qbox.solved{border-style:solid;background:linear-gradient(180deg,#FFF0B8,#FFC24D);color:var(--deep);animation:pop .45s cubic-bezier(.3,1.6,.5,1);box-shadow:0 0 22px rgba(255,200,80,.6)}
.eqtext{font-family:var(--latin);font-weight:800;font-size:clamp(36px,6vw,56px);display:flex;align-items:center;gap:.3em;line-height:1}
.eqtext .qbox{width:clamp(60px,10vw,86px);font-size:inherit}
.treebox{position:relative;background:var(--glass);border:2px solid var(--goldline);border-radius:34px;padding:16px 18px 16px 76px;max-width:100%;box-sizing:border-box}
.treebox .sq{position:absolute;left:8px;bottom:6px;width:62px}
.treebox .sq svg{width:100%;height:auto;display:block}
.sq.chomp{animation:chomp .35s ease}
@keyframes chomp{50%{transform:scale(1.15,.9) translateY(4px)}}

/* gate */
.gate{position:relative;width:min(88%,460px);border-radius:230px 230px 18px 18px/150px 150px 18px 18px;padding:84px 18px 26px;box-sizing:border-box;border:3px solid var(--gold);background:#FFF3C4;overflow:hidden;box-shadow:0 0 30px rgba(255,210,110,.35)}
.gate .light{position:absolute;inset:0;background:radial-gradient(circle at 50% 60%,#FFFBEA,#FFE08A 45%,#F7B84B)}
.leaf{position:absolute;top:0;bottom:0;width:50%;background:linear-gradient(180deg,#6A5AD0,#3B2F92);transition:transform 1.1s cubic-bezier(.6,0,.3,1)}
.leaf.l{left:0;transform-origin:0 50%;border-right:2px solid var(--gold)}
.leaf.r{right:0;transform-origin:100% 50%;border-left:2px solid var(--gold)}
.leaf::after{content:"";position:absolute;top:86%;width:10px;height:10px;border-radius:50%;background:var(--gold)}
.leaf.l::after{right:10px}.leaf.r::after{left:10px}
.gate .keystar{position:absolute;top:14px;left:50%;transform:translateX(-50%);width:44px;z-index:2;transition:opacity .4s}
.gate.open .leaf.l,.gate.open .leaf.r{transform:scaleX(0)}
.gate.open .slots,.gate.open .keystar{opacity:0;transition:opacity .3s}
.slots{position:relative;z-index:2;display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.slots i{width:clamp(56px,10vw,84px);aspect-ratio:1;border:3px dashed var(--goldline);border-radius:22px;display:grid;place-items:center;font-style:normal;font-family:var(--latin);font-weight:800;font-size:clamp(32px,6vw,52px);background:rgba(20,16,60,.4);line-height:1;padding-top:.1em;box-sizing:border-box;color:var(--deep)}
.slots i.fill{background:linear-gradient(180deg,#FFF0B8,#FFC24D);border-style:solid;border-color:#fff;box-shadow:0 0 18px rgba(255,210,110,.7)}

/* feedback */
.right{animation:yay .6s}
@keyframes yay{30%{transform:scale(1.18) rotate(-4deg)}60%{transform:scale(1.05) rotate(3deg)}}
.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
@keyframes pop{from{transform:scale(.6);opacity:0}}

/* overlays */

 #toast{top:calc(70px + env(safe-area-inset-top,0px))}
}

.overlay .card{max-height:100%;overflow:auto;box-sizing:border-box}
.rainfield{height:min(40vh,320px)}
@keyframes fall{to{transform:translateY(calc(min(40vh,320px) + 80px)) rotate(200deg)}}
.rcd{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--latin);font-weight:800;font-size:80px;color:var(--gold);text-shadow:0 0 20px rgba(255,210,110,.7)}
@media (max-height:760px){.rainfield{height:min(34vh,260px)}@keyframes fall{to{transform:translateY(calc(min(34vh,260px) + 80px)) rotate(200deg)}}}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:40}
@media (prefers-reduced-motion:reduce){*,*::before{animation:none!important;transition:none!important}}

/* ===== v4 ===== */
.ppill{display:inline-flex;align-items:center;gap:8px;background:var(--glass);border:2px solid var(--goldline);border-radius:999px;padding:5px 12px;font-size:15px;white-space:nowrap}
.ppill .pbar{width:clamp(50px,10vw,110px);height:10px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden}
.ppill .pbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#FF8FC8,#FFD98A);box-shadow:0 0 10px #FFD98A;transition:width .6s}
.ppill b{font-family:var(--latin);font-weight:800;color:var(--gold);font-size:17px;padding-top:2px}
@media (max-width:480px){.ppill .nm{display:none}}

/* title */
.title{position:relative}
.art .castleback{position:absolute;width:88%;left:6%;bottom:18%;opacity:.28;filter:blur(.3px)}
.art .glowstage{position:absolute;left:8%;right:8%;bottom:-3%;height:16%;border-radius:50%;background:radial-gradient(closest-side,rgba(255,222,150,.45),rgba(255,222,150,0));}
.art > svg.pr,.art > .petw{position:relative;z-index:1}
.art .petw{height:50%;display:flex;align-items:flex-end;margin-right:-5%}
.art .petw svg{height:100%;width:auto}
.logo{display:flex;flex-direction:column;align-items:flex-start;gap:4px}
.logo .en{font-family:var(--latin);font-weight:700;letter-spacing:.32em;font-size:clamp(12px,1.5vw,15px);color:var(--gold);opacity:.9}
.logo h1{font-size:clamp(46px,7.4vw,86px);line-height:1.05}
.logo .rib{position:relative;display:inline-block;background:linear-gradient(90deg,#FF7FB8,#A98BF0);color:#fff;font-size:clamp(20px,3vw,30px);padding:.12em 1.1em .18em;border-radius:12px;letter-spacing:.4em;box-shadow:0 0 22px rgba(255,127,184,.45);margin-left:.4em}
.logo .rib::before,.logo .rib::after{content:"";position:absolute;top:22%;width:14px;height:56%;background:#C9588F;z-index:-1}
.logo .rib::before{left:-8px;transform:skewY(-20deg)}.logo .rib::after{right:-8px;transform:skewY(20deg)}
.logo .spark{position:absolute;width:22px;height:22px}
.titlelogo{position:relative}
.btn .ic,.btn2 .ic{display:inline-block;width:.9em;height:.9em;vertical-align:-.08em;margin-right:.3em}
@media (max-width:720px){.logo{align-items:center}.art .castleback{bottom:12%}}

/* story */
.story{height:100%;display:grid;place-items:center;position:relative}
.scard{width:min(720px,100%);max-height:100%;display:flex;flex-direction:column;gap:14px;align-items:center;background:linear-gradient(180deg,rgba(60,50,140,.85),rgba(30,26,86,.9));border:2px solid var(--gold);border-radius:32px;padding:18px 20px 20px;box-sizing:border-box;box-shadow:0 0 40px rgba(255,210,110,.2);animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
.scene{width:100%;aspect-ratio:16/8;max-height:42vh;border-radius:22px;overflow:hidden;background:radial-gradient(ellipse at 50% 110%,#4B3A8E,#1B1D52 70%);position:relative}
.scene svg.bg{position:absolute;inset:0;width:100%;height:100%}
.scene .actors{position:absolute;left:0;right:0;bottom:6%;height:78%;display:flex;align-items:flex-end;justify-content:center;gap:3%}
.scene .actors > svg,.scene .actors > div{height:100%;width:auto}
.scene .actors .small{height:55%}
.stext{margin:0;font-size:clamp(19px,2.8vw,25px);line-height:1.6;text-align:center;text-wrap:balance;min-height:3.2em}
.sdots{display:flex;gap:8px}.sdots i{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.25)}.sdots i.on{background:var(--gold)}
.skip{position:absolute;top:0;right:0;font-size:15px;color:var(--text2);padding:8px 14px;border-radius:999px;background:var(--glass2);border:1px solid rgba(255,255,255,.2)}
.bob{animation:bob2 2.4s ease-in-out infinite}
@keyframes bob2{50%{transform:translateY(-8px)}}

/* guide */
.guide{height:100%;display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:18px}
.gside{display:flex;flex-direction:column;gap:12px;min-height:0}
.gstep{display:flex;align-items:center;gap:10px}
.gstep .dots{display:flex;gap:6px}.gstep .dots i{width:28px;height:6px;border-radius:9px;background:rgba(255,255,255,.2)}.gstep .dots i.on{background:var(--gold)}
.gtitle{margin:0;font-size:clamp(24px,3.6vw,34px);font-weight:400;color:var(--gold)}
.gsub{margin:0;color:var(--text2);font-size:16px}
.gopts{flex:1;min-height:0;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px;align-content:start;padding:2px}
.gopts .opt{animation:pop .45s cubic-bezier(.3,1.6,.5,1) backwards}
.gnav{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.stagebox .team2{position:relative;height:96%;display:flex;align-items:flex-end;justify-content:center;width:100%}
.stagebox .team2 .pr{height:94%;width:auto;max-width:none}
.stagebox .team2 .petw{position:absolute;left:2%;bottom:0;height:30%;display:flex;align-items:flex-end;z-index:2}
.stagebox .team2 .petw svg{height:100%;width:auto}
@media (max-width:720px){.guide{grid-template-columns:1fr;grid-template-rows:32% 1fr;gap:10px}.gopts{grid-template-columns:repeat(auto-fill,minmax(96px,1fr))}}

/* map v4 */
.banner{font-family:var(--cjk);font-size:34px;fill:#fff}
.nnum{font-family:var(--latin);font-weight:800;font-size:22px;fill:var(--deep)}
.maprow .btn2.tiny{font-size:15px;padding:.25em .9em .3em;opacity:.85}

/* stage variants */
.pet.pw{height:62%;display:flex;align-items:flex-end;margin-right:-8px}
.pet.pw svg{height:100%;width:auto}
.qtag{display:inline-block;font-size:.62em;vertical-align:.25em;margin-right:.5em;padding:.15em .7em;border-radius:999px;background:var(--tagc,#FF8FC8);color:var(--deep)}

/* quiz cards */
.quiz{display:flex;gap:clamp(10px,2.4vw,24px);flex-wrap:wrap;justify-content:center}
.qcard{position:relative;width:clamp(104px,20vw,168px);aspect-ratio:.86;border-radius:28px;background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,.05));border:2px solid var(--goldline);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;animation:pop .5s cubic-bezier(.3,1.6,.5,1) backwards;animation-delay:var(--dl,0s);box-shadow:0 8px 0 rgba(0,0,0,.25);color:var(--text)}
.qcard:active{transform:translateY(4px);box-shadow:0 3px 0 rgba(0,0,0,.25)}
.qcard .emo{font-size:clamp(50px,9vw,84px);line-height:1.1;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.qcard .num{font-family:var(--latin);font-weight:800;font-size:clamp(40px,7vw,64px);color:var(--gold);line-height:1}
.qcard .num.t{font-size:clamp(26px,4.6vw,40px)}
.qcard .lbl{font-size:clamp(16px,2.2vw,20px);text-align:center;padding:0 6px;line-height:1.3}
.qcard.sq{aspect-ratio:1}
.qhead{font-size:clamp(56px,10vw,90px);line-height:1;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;filter:drop-shadow(0 0 16px rgba(255,255,255,.35));animation:bob2 2.4s ease-in-out infinite}

/* maze */
.mazewrap{position:relative;width:min(84vw,48vh,430px);aspect-ratio:1}
.maze{position:absolute;inset:0;display:grid;gap:6px}
.cell{border-radius:14px;background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.08);position:relative;display:grid;place-items:center;transition:background .3s}
.cell.tree{background:transparent;border-color:transparent}
.cell.tree svg{width:92%;height:92%}
.cell.seen{background:rgba(255,217,138,.22)}
.cell.near{border:2px dashed var(--gold);box-shadow:0 0 14px rgba(255,217,138,.45);animation:nearp 1.2s ease-in-out infinite}
@keyframes nearp{50%{box-shadow:0 0 22px rgba(255,217,138,.8)}}
.cell.goal svg{width:86%;height:86%}
.mtoken{position:absolute;transition:left .35s cubic-bezier(.3,1.3,.5,1),top .35s cubic-bezier(.3,1.3,.5,1);pointer-events:none;display:grid;place-items:end center;z-index:2}
.mtoken svg{height:120%;width:auto;margin-bottom:10%}

/* rewards */
.rbox{width:clamp(120px,22vw,170px);cursor:pointer;animation:boxwig 1.6s ease-in-out infinite}
.rbox.shake{animation:boxshake .4s ease}
@keyframes boxwig{0%,70%,100%{transform:rotate(0)}78%{transform:rotate(-6deg)}86%{transform:rotate(6deg)}}
@keyframes boxshake{25%{transform:rotate(-12deg) scale(1.05)}75%{transform:rotate(12deg) scale(1.05)}}
.rbox svg{width:100%;height:auto;display:block}
.chests{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.chest{width:clamp(88px,15vw,120px);animation:pop .5s cubic-bezier(.3,1.6,.5,1) backwards}
.chest:nth-child(2){animation-delay:.12s}.chest:nth-child(3){animation-delay:.24s}
.chest svg{width:100%;height:auto;display:block}
.chest .lid{transition:transform .5s cubic-bezier(.3,1.5,.5,1);transform-origin:10px 40px}
.chest.open .lid{transform:rotate(-28deg) translateY(-6px)}
.rainfield{position:relative;width:100%;height:min(46vh,340px);border-radius:24px;overflow:hidden;background:rgba(10,8,40,.35);border:2px dashed var(--goldline)}
.fgem{position:absolute;top:-60px;width:54px;height:54px;animation:fall linear forwards;cursor:pointer;touch-action:manipulation}
.fgem svg{width:100%;height:100%;filter:drop-shadow(0 0 8px #9FF3FF)}
@keyframes fall{to{transform:translateY(calc(min(46vh,340px) + 80px)) rotate(200deg)}}
.rcount{font-family:var(--latin);font-weight:800;font-size:28px;color:var(--gold)}
.scroll{background:linear-gradient(180deg,#FFF6DE,#F6E2B8);color:#5A3A2A;border-radius:18px;padding:22px 26px;line-height:1.8;font-size:clamp(18px,2.5vw,22px);position:relative;box-shadow:0 0 30px rgba(255,220,150,.4);text-align:left;width:100%;box-sizing:border-box}
.scroll::before,.scroll::after{content:"";position:absolute;left:-6px;right:-6px;height:14px;border-radius:8px;background:linear-gradient(180deg,#E8C98A,#C9A060)}
.scroll::before{top:-7px}.scroll::after{bottom:-7px}
.scroll .seal{position:absolute;right:14px;bottom:10px;width:40px;height:40px}
.scroll .sign{display:block;text-align:right;margin-top:6px;color:#8A5A3A}
.card .petshow{display:flex;align-items:flex-end;justify-content:center;gap:8px;height:clamp(120px,22vh,180px)}
.card .petshow svg{height:100%;width:auto}

/* celebrations */
.rainbow{position:absolute;left:4%;right:4%;top:2%;height:70%;pointer-events:none;z-index:4}
.rainbow path{fill:none;stroke-width:12;stroke-linecap:round;stroke-dasharray:1200;stroke-dashoffset:1200;animation:rbdraw 1.1s ease forwards,rbfade .6s ease 1.5s forwards}
@keyframes rbdraw{to{stroke-dashoffset:0}}
@keyframes rbfade{to{opacity:0}}
.team.twirl .pr{animation:twirl2 .9s ease}
@keyframes twirl2{50%{transform:scaleX(-1) translateY(-10px)}}
.pet.dance{animation:petdance 1.2s ease}
@keyframes petdance{20%{transform:translateY(-22px) rotate(-10deg)}40%{transform:translateY(0) rotate(0)}60%{transform:translateY(-16px) rotate(10deg)}80%{transform:translateY(0)}}
.chend{height:100%;border-radius:28px;border:2px solid var(--goldline);background:rgba(24,20,70,.35);position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px;box-sizing:border-box;text-align:center}
.chend .trio{height:min(38vh,280px)}
.chend h2{margin:0;font-size:clamp(30px,5.5vw,50px);font-weight:400;color:var(--gold);text-shadow:0 0 18px rgba(255,200,80,.6)}
.chend p{margin:0;font-size:clamp(17px,2.4vw,21px);color:var(--text2)}
.gate.leafy .leaf{background:linear-gradient(180deg,#3FA47A,#1F5F4A)}

/* ===== chapter 2 ===== */
.rslots{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.rslot{position:relative;width:clamp(76px,13vw,110px);aspect-ratio:.9;border-radius:20px;border:3px dashed var(--goldline);background:rgba(20,16,60,.35);display:grid;place-items:center}
.rslot i{position:absolute;top:-10px;left:-8px;width:26px;height:26px;border-radius:50%;background:var(--gold);color:var(--deep);font-style:normal;font-family:var(--latin);font-weight:800;display:grid;place-items:center;font-size:15px;padding-top:2px;box-sizing:border-box}
.rslot.fill{border-style:solid;background:linear-gradient(180deg,rgba(255,240,184,.25),rgba(255,194,77,.15));box-shadow:0 0 16px rgba(255,210,110,.45)}
.rslot span{display:flex;flex-direction:column;align-items:center;gap:2px}
.rslot em{font-style:normal;font-size:clamp(34px,6vw,50px);line-height:1.1;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.rslot small{font-size:13px;text-align:center;line-height:1.2}
.qcard.gone{visibility:hidden}
.sortstage{display:flex;flex-direction:column;align-items:center;gap:4px;min-height:clamp(120px,22vh,170px);justify-content:center}
.sortitem{display:flex;flex-direction:column;align-items:center;gap:2px}
.sortitem .emo{font-size:clamp(70px,13vw,110px);line-height:1.1;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;filter:drop-shadow(0 0 16px rgba(255,255,255,.35))}
.sortitem .lbl{font-size:clamp(18px,2.6vw,22px)}
.pop2{animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
.sortcount{font-family:var(--latin);font-weight:800;color:var(--text2);font-size:15px}
.baskets{display:flex;gap:clamp(14px,4vw,40px);justify-content:center;flex-wrap:wrap}
.basket{width:clamp(140px,26vw,220px);min-height:clamp(120px,20vh,160px);border-radius:28px;background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,.05));border:2px solid var(--goldline);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:4px;padding:10px 8px;box-shadow:0 8px 0 rgba(0,0,0,.25);color:var(--text)}

.basket .bin{display:flex;flex-wrap:wrap;gap:2px;justify-content:center;font-size:24px;min-height:28px}

.flyemo{position:fixed;z-index:30;pointer-events:none;display:grid;place-items:center;font-size:clamp(70px,13vw,110px);line-height:1;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.clockw{width:min(40vw,30vh,240px);aspect-ratio:1;filter:drop-shadow(0 0 20px rgba(255,210,110,.35));animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
.clockw svg{width:100%;height:100%}
.coins{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center;max-width:min(560px,90vw)}
.coin{width:auto!important;aspect-ratio:auto!important;animation:drop .6s cubic-bezier(.3,1.4,.5,1) backwards;animation-delay:var(--dl)}

.coin[data-n]::after{top:-12px;right:-6px;width:auto;min-width:26px;padding:3px 6px 0;border-radius:999px}
.road{position:relative;width:min(92%,640px);height:clamp(170px,30vh,250px);border-radius:24px;background:linear-gradient(180deg,#2A2F72 0 38%,#3A3A58 38% 100%);overflow:hidden;border:2px solid var(--goldline)}
.zebra{position:absolute;left:30%;right:30%;top:42%;bottom:8%;display:flex;flex-direction:column;justify-content:space-between}

.tlight{position:absolute;right:6%;top:6%;width:44px;padding:6px;border-radius:14px;background:#1A1A2E;display:flex;flex-direction:column;gap:6px;border:2px solid #555}

.tlight .r.on{box-shadow:0 0 20px #FF4F5F}.tlight .g.on{box-shadow:0 0 20px #3FE08A}
.walker{position:absolute;left:12%;bottom:4%;height:60%;transition:left 1.2s ease-in-out}

@keyframes drive{from{left:-20%}to{left:110%}}
.book{display:flex;align-items:center;gap:14px;max-width:min(620px,92vw);background:linear-gradient(180deg,#FFF6DE,#F6E2B8);color:#5A3A2A;border-radius:20px;padding:12px 18px;box-shadow:0 0 24px rgba(255,220,150,.35);animation:pop .5s cubic-bezier(.3,1.6,.5,1)}

.chsel{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}
.chgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;width:min(100%,900px)}
.chcard{position:relative;border-radius:24px;padding:18px 16px;min-height:120px;background:linear-gradient(160deg,rgba(90,70,180,.85),rgba(38,32,94,.9));border:2px solid var(--gold);display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;box-shadow:0 0 22px rgba(255,210,110,.2);animation:pop .5s cubic-bezier(.3,1.6,.5,1) backwards}
.chcard:nth-child(2){animation-delay:.08s}.chcard:nth-child(3){animation-delay:.16s}.chcard:nth-child(4){animation-delay:.24s}.chcard:nth-child(5){animation-delay:.32s}

.chcard .lk{position:absolute;right:14px;top:14px;width:24px;height:24px}

.nameask .face svg{width:96px;height:96px}.nameask .nameinp{text-align:center;font-size:24px}
.namebtn{color:#FFE9A8;border-color:#FFD98A;animation:nudge 1.6s ease 1s 2}

.cbub{position:absolute;left:50%;transform:translateX(-50%);width:min(92vw,520px);background:#FFF9FC;color:#3A2A6A;border-radius:22px;padding:14px 18px;box-sizing:border-box;box-shadow:0 8px 0 rgba(16,10,56,.45);border:3px solid #FFD98A;animation:pop .4s cubic-bezier(.3,1.6,.5,1)}

.crow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.cstep{font-family:var(--latin);color:#9A86C8;font-size:15px;margin-right:auto}
.ctip{color:#B0457A;font-size:16px;margin-right:auto}
.crow .btn{font-size:20px;padding:.25em 1.1em .3em}
.crow .btn2{color:#3A2A6A;border-color:#C9B8FF;background:#F0E8FF}

.catchbar{display:flex;gap:10px;justify-content:center}

 const DW={'0,1':'往右','1,0':'往下','0,-1':'往左','-1,0':'往上'};
 $$('.cell',play).forEach(el=>el.onclick=()=>{if(S.lock)return;const [x,y]=el.dataset.k.split(',').map(Number);
  if(!open.has(el.dataset.k)){wrong(el);return}
  const dx=x-pos[0],dy=y-pos[1];if(Math.abs(dx)+Math.abs(dy)!==1){el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake');say(['要走旁邊的格子喔']);return}

}

function longPress(btn,act,ms=1100,tip){btn.onclick=null;let t=0;

 const end=()=>{if(t){clearTimeout(t);t=0}if(btn.classList.contains('holding')){btn.classList.remove('holding');if(tip)toast(tip)}};
 btn.addEventListener('pointerdown',start);['pointerup','pointerleave','pointercancel'].forEach(ev=>btn.addEventListener(ev,end))}

 b.addEventListener('pointerdown',e=>{if(S.screen!=='stage'){return}e.preventDefault();b.classList.add('holding');t=setTimeout(()=>{b.classList.remove('holding');t=0;act()},1100)});
 ['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,()=>{if(S.screen!=='stage')return;if(t){clearTimeout(t);t=0;b.classList.remove('holding');toast('要長按才會離開這一關喔')}}));

});

function prHappy(){const pr=$('#team .pr');if(pr){pr.classList.remove('happy','twirl');void pr.getBoundingClientRect();pr.classList.add('happy','twirl');setTimeout(()=>pr.classList.remove('happy','twirl'),1700)}
 const pt=$('#pet');if(pt){pt.classList.remove('petjump');void pt.offsetWidth;pt.classList.add('petjump')}}

function still(v){return v.replace(/ filter="url\(#[^"]*\)"/g,'')}
function magicRing(host){setTimeout(()=>{const p=host&&host.querySelector('.pr');if(p)p.classList.remove('happy')},1300);if(!host||reduced)return;const r=document.createElement('div');r.className='mring';r.innerHTML=`<svg viewBox="0 0 200 200">${Array.from({length:12},(_,i)=>{const t=i/12*Math.PI*2;return `<path d="${starD(100+80*Math.cos(t),100+80*Math.sin(t),i%2?5:8)}" fill="${['#FFE27A','#FF9FC8','#9FE8FF'][i%3]}"/>`}).join('')}<circle cx="100" cy="100" r="80" fill="none" stroke="#FFE9A8" stroke-width="2" stroke-dasharray="4 8" opacity=".8"/></svg>`;host.appendChild(r);setTimeout(()=>r.remove(),1000)}
const HSN={long:'長直髮',twin:'雙馬尾',bun:'丸子頭',curly:'短捲髮'},SKN={light:'白皙',tan:'小麥色',deep:'古銅色'},EYN={violet:'紫色',brown:'棕色',blue:'藍色',green:'綠色'};

 el.innerHTML=`<div class="me">

  <div class="mesec"><span class="lab">髮型</span><div class="merow">${Object.keys(HSN).map(k=>`<button class="opt meo" data-hs="${k}" aria-pressed="${(S.look.hs||'long')===k}">${still(princess({...S.look,hs:k,head:''},'','8 0 104 104'))}<span>${HSN[k]}</span></button>`).join('')}</div></div>
  <div class="mesec"><span class="lab">膚色</span><div class="merow">${Object.keys(SKT).map(k=>`<button class="swbtn" data-sk="${k}" aria-pressed="${(S.look.skin||'light')===k}" aria-label="${SKN[k]}"><i style="background:${SKT[k]}"></i><span>${SKN[k]}</span></button>`).join('')}</div></div>
  <div class="mesec"><span class="lab">眼睛</span><div class="merow">${Object.keys(EYEC).map(k=>`<button class="swbtn" data-ey="${k}" aria-pressed="${(S.look.eye||'violet')===k}" aria-label="${EYN[k]}"><i style="background:radial-gradient(circle at 60% 35%,#fff 0 14%,${EYEC[k][1]} 16% 55%,${EYEC[k][0]} 57%)"></i><span>${EYN[k]}</span></button>`).join('')}</div></div></div>`;
 const upd=(k,v)=>{S.look[k]=v;save();meOpts(el,done);done();tone(880,0,.15,'triangle',.08);tone(1320,.08,.2,'triangle',.06)};
 $$('[data-hs]',el).forEach(b=>b.onclick=()=>{upd('hs',b.dataset.hs);say([HSN[b.dataset.hs]])});
 $$('[data-sk]',el).forEach(b=>b.onclick=()=>upd('skin',b.dataset.sk));
 $$('[data-ey]',el).forEach(b=>b.onclick=()=>{upd('eye',b.dataset.ey);say([EYN[b.dataset.ey]+'的眼睛'])});

const LVL=[0,6,16,30,50];

const stat=ts=>Math.max(0,Math.min(100,Math.round(100-(Date.now()-ts)/3600e3*10)));
const plv=l=>{let v=1;LVL.forEach((t,i)=>{if(l>=t)v=i+1});return v};
const PFOOD=[['🍎','蘋果'],['🥕','紅蘿蔔'],['🍪','餅乾'],['🐟','小魚'],['🍓','草莓'],['🍯','蜂蜜']];

 const pets=ITEMS.filter(x=>x.slot==='pet'&&owns(x.id));
 screen.innerHTML=`<div class="park petpark">${parkHead('寵物小屋')}
  <div class="phouse"><div class="pscene" id="pscene"><svg class="bg" viewBox="0 0 800 400" preserveAspectRatio="xMidYMax slice"><rect width="800" height="400" fill="#3A2E7A"/><rect y="290" width="800" height="110" fill="#5A3E8A"/><rect x="235" y="40" width="130" height="100" rx="10" fill="#1E2466" stroke="#FFD98A" stroke-width="6"/><circle cx="325" cy="75" r="16" fill="#FFF3C4"/><path d="M300 62 l3 7 7 1 -5 5 1 7 -6 -3 -6 3 1 -7 -5 -5 7 -1z" fill="#FFE79A" opacity=".7" transform="translate(-40 20) scale(.6)"/><ellipse cx="400" cy="330" rx="150" ry="26" fill="#FF9FC8" opacity=".5"/></svg>

   <div class="pside"><div class="pname"><b>${it.name}</b><span class="plv">Lv.${lv}</span></div>
    <div class="love"><span>${'💗'.repeat(lv)}${'🤍'.repeat(5-lv)}</span><small>${nxt?`好感度 ${P.love} / ${nxt}`:'好感度滿滿！'}</small></div>
    ${[['h','肚子','🍽️'],['c','乾淨','🫧'],['j','開心','🎾']].map(([k,n,e])=>`<div class="pbar2"><span>${n}</span><i><b style="width:${stat(P[k])}%"></b></i></div>`).join('')}
    <div class="pacts"><button class="btn2" data-a="feed">🍎 餵食</button><button class="btn2" data-a="bath">🫧 洗澡</button><button class="btn2" data-a="brush">✨ 梳毛</button><button class="btn2" data-a="play">🎾 玩球</button></div>
    ${pets.length>1?`<div class="pswitch">${pets.map(x=>`<button class="psw${x.id===S.look.pet?' on':''}" data-id="${x.id}" aria-label="${x.name}">${petSVG(x.id,'')}</button>`).join('')}</div>`:''}
   </div></div></div>`;
 bindBack();
 const P0=P;say([`${it.name}在等你喔！`,stat(P0.h)<40?'牠肚子餓了，餵牠吃東西吧！':stat(P0.c)<40?'牠髒髒的，幫牠洗個澡吧！':stat(P0.j)<40?'牠想玩，陪牠玩球吧！':'要幫牠做什麼呢？']);
 $$('.psw').forEach(b=>b.onclick=()=>{S.look.pet=b.dataset.id;saveP();SCREENS.pethouse()});
 $$('[data-a]').forEach(b=>b.onclick=()=>petAct(b.dataset.a));
};
function petGain(k){const P=pc();const before=stat(P[k]);P[k]=Date.now();const d=today();if(P.day!==d){P.day=d;P.dl=0}
 let msg='';if(before<85&&P.dl<12){const lv0=plv(P.love);P.love++;P.dl++;const lv1=plv(P.love);if(lv1>lv0){addGems(3*lv1);msg=`好感度升到 Lv.${lv1}！寵物長大了一點，送你 ${3*lv1} 顆寶石！`}}
 saveP();return msg}
function petAct(a){const pb=$('#pbig'),fx=$('#pfx');if(!pb)return;$$('[data-a]').forEach(b=>b.disabled=true);
 const done=(k,line)=>{const m=petGain(k);pb.classList.remove('happy2');void pb.offsetWidth;pb.classList.add('happy2');burstEl(pb,24);sfx('right');
  say([line,m].filter(Boolean)).then(()=>{if(S.screen==='pethouse')SCREENS.pethouse()});if(m){confetti();toast(m)}};
 if(a==='feed'){fx.innerHTML=`<div class="pfood">${shuffle(PFOOD).slice(0,3).map(([e,n])=>`<button data-n="${n}">${art(e)}<span>${n}</span></button>`).join('')}</div>`;say(['要餵牠吃什麼呢？']);
  $$('.pfood button',fx).forEach(b=>b.onclick=()=>{fx.innerHTML='';pb.classList.add('chomp');sfx('crunch');setTimeout(()=>{pb.classList.remove('chomp');done('h',`好好吃的${b.dataset.n}！謝謝你！`)},900)})}
 if(a==='bath'){let n=0;const N=6;fx.innerHTML=Array.from({length:N},(_,i)=>`<button class="bub" style="left:${20+Math.random()*60}%;top:${15+Math.random()*55}%;--d:${(i*.1).toFixed(1)}s"></button>`).join('');say(['點破泡泡，幫牠洗得香香的！']);
  $$('.bub',fx).forEach(b=>b.onclick=()=>{b.remove();n++;tone(700+n*80,0,.12,'sine',.08);if(n>=N)done('c','洗得好乾淨，香香的！')})}
 if(a==='brush'){let n=0;fx.innerHTML='<div class="brushhint">在寵物身上點一點，幫牠梳毛！</div>';say(['在寵物身上點一點，幫牠梳毛！']);
  pb.onclick=e=>{n++;const r=pb.getBoundingClientRect();burst(e.clientX||r.left+r.width/2,e.clientY||r.top+r.height/2,6,true);tone(900+n*60,0,.1,'triangle',.07);if(n>=5){pb.onclick=null;fx.innerHTML='';done('c','毛毛好柔順，亮晶晶！')}}}
 if(a==='play'){let n=0;fx.innerHTML='<button class="pball">⚽</button>';say(['點一下球，丟給牠！丟三次喔！']);const ball=$('.pball',fx);
  ball.onclick=()=>{n++;ball.classList.remove('throw');void ball.offsetWidth;ball.classList.add('throw');pb.classList.remove('jumpy');void pb.offsetWidth;pb.classList.add('jumpy');sfx('hop');if(n>=3){ball.onclick=null;setTimeout(()=>{fx.innerHTML='';done('j','好好玩！再陪我玩喔！')},700)}}}
}

/* ================= v2.1: 抽籤袋（字母、注音、數字輪流出，不會漏） ================= */
// 需要在 V2 之前用到，所以自己讀存檔
const BAGKEY='pp4bag';
const BAG=(()=>{try{return JSON.parse(localStorage.getItem(BAGKEY)||'{}')||{}}catch(e){return {}}})();BAG.b=BAG.b||{};BAG.g=BAG.g||{};
const saveBag=()=>{try{localStorage.setItem(BAGKEY,JSON.stringify(BAG))}catch(e){}};
// g[字]={s:出現次數,o:一次答對次數,w:答錯次數}
const glWeak=x=>{const g=BAG.g[x];return g&&g.w>0&&(g.o||0)<(g.w||0)+1};
// v3.0 會了：在兩個不同的日子一次答對、對的比錯的多、十天內有練過、而且不是常錯
const GL_FORGET=10*864e5;
const glKnown=x=>{const g=BAG.g[x];if(!g||glWeak(x))return false;let d=g.d;if(!d)d=(g.o>=2?['old']:[]);return d.length>=2&&g.o>g.w&&(!g.lt||Date.now()-g.lt<GL_FORGET)};
function bagPick(pool,tag){const key=(tag||'g')+':'+pool.join('');let b=(BAG.b[key]||[]).filter(x=>pool.includes(x));
 BAG.d=BAG.d||{};let d=BAG.d[key]||[];if(!b.length){b=shuffle(pool.slice());d=[]}
 let cand=b.filter(x=>x!==S.last);if(!cand.length)cand=b;
 const weak=tag?[]:cand.filter(glWeak);const t=weak.length&&Math.random()<.5?pick(weak):cand[0];
 // 常錯的字：同一輪會出現兩次（第一次先不拿出袋子）
 if(!tag&&glWeak(t)&&!d.includes(t)){d.push(t)}else{b=b.filter(x=>x!==t)}BAG.b[key]=b;BAG.d[key]=d;if(!tag){const g=BAG.g[t]||(BAG.g[t]={s:0,o:0,w:0});g.s++}saveBag();return t}
function glMark(ok){const r=S.revKey;if(!r||r.k!=='g')return;const t=String(r.i).toUpperCase();const g=BAG.g[t]||(BAG.g[t]={s:1,o:0,w:0});if(ok)g.o++;else g.w++;saveBag()}

function playFx(k){const T=(f,t,d,w,v)=>tone(f,t,d,w,v);
 if(k==='siren'){for(let i=0;i<6;i++)T(i%2?740:960,i*.34,.32,'square',.045);return 2100}
 if(k==='firebell'){for(let i=0;i<8;i++){T(1480,i*.13,.12,'triangle',.09);T(2220,i*.13,.08,'sine',.04)}return 1200}
 if(k==='bell'){[0,.3].forEach(t=>{T(2100,t,.25,'sine',.1);T(2650,t+.03,.22,'sine',.07)});return 800}
 if(k==='door'){T(880,0,.7,'sine',.14);T(698,.5,1,'sine',.14);return 1500}
 if(k==='drum'){for(let i=0;i<3;i++){T(120,i*.3,.22,'sine',.3);T(80,i*.3,.25,'triangle',.2)}return 1000}
 if(k==='piano'){['C5','E5','G5','C6','G5','E5','C5'].forEach((n,i)=>T(NOTEF(n),i*.2,.45,'triangle',.11));return 1700}
 if(k==='train'){[0,.8].forEach(t=>{T(392,t,.6,'sawtooth',.04);T(494,t,.6,'sawtooth',.035);T(587,t,.6,'sine',.04)});return 1600}
 if(k==='elise'){['E5','D#5','E5','D#5','E5','B4','D5','C5','A4'].forEach((n,i)=>T(NOTEF(n),i*.2+(i===8?.1:0),i===8?.6:.3,'triangle',.11));return 2200}
 return 0}

 const my=++fxGen;if(!parts||!parts.some(p=>p&&p.fx))return _sayFx(parts,opt);
 return (async()=>{let grp=[];const flush=async()=>{if(grp.length){const g=grp;grp=[];await _sayFx(g,opt)}};
  for(const p of parts){if(my!==fxGen)return;if(p&&p.fx){await flush();if(my!==fxGen)return;try{hush()}catch(e){}const ms=S.sound?playFx(p.fx):0;await wait(ms);continue}grp.push(p)}

/* ================= v2.5: 王子用男生的聲音（王子說的話、王子寫的信） ================= */
const PRINCE_LETTERS=new Set(CHAPTERS.filter(c=>c.sign!=='star').map(c=>c.letter.replace(/<br>/g,'')));
function princeMap(parts){if(!Array.isArray(parts))return parts;
 return parts.map(p=>{if(typeof p!=='string')return p;if(p.startsWith('王子說：'))return {zh:p.slice(4),who:'prince'};if(PRINCE_LETTERS.has(p))return {zh:p,who:'prince'};return p})}
const _sayPrince=say;
say=function(parts,opt){return _sayPrince(princeMap(parts),opt)};
const _voSpeakPr=voSpeak;
voSpeak=async function(p,opt,gen){
 if(!(p&&typeof p==='object'&&p.who==='prince'))return _voSpeakPr(p,opt,gen);
 const txt=String(p.zh||'').trim();const plain={zh:txt};opt=Object.assign({},opt||{},{pitch:.75});
 if(!S.vo||!VO.idx)return _voSpeakPr(plain,opt,gen);
 const keys=voSents(txt).map(s=>'pz|'+s.trim()).filter(k=>k.length>3);
 if(!keys.length||!keys.every(k=>VO.idx[k]))return _voSpeakPr(plain,opt,gen);
 const bs=await Promise.all(keys.map(k=>voBuf(k)));
 if(bs.some(b=>!b))return _voSpeakPr(plain,opt,gen);
 for(let i=0;i<bs.length;i++){if(gen!==sayGen)return;const ok=await voPlay(bs[i]);if(ok===false&&gen===sayGen){return _voSpeakPr({zh:voSents(txt).slice(i).join('')},opt,gen)}if(i<bs.length-1)await wait(60)}};

/* ================= v2.6 動態難度：會了就自動加新的字母、注音 ================= */
const AD_L=[10,14,18,22,26],AD_Z=[8,12,16,21,24,28,32,37];
function adState(){BAG.ad=BAG.ad||{l:0,z:0,zm:3,low:0};if(BAG.ad.zm==null)BAG.ad.zm=3;return BAG.ad}
const adZKey=()=>S.diff==='mid'?'zm':'z';
function adLetN(){return S.diff==='easy'?AD_L[Math.min(adState().l,AD_L.length-1)]:26}
function adZyBase(){return S.diff==='mid'?3:0}
function adZyN(){if(S.diff==='hard')return 37;const st=adState();return AD_Z[Math.min(Math.max(st[adZKey()],adZyBase()),AD_Z.length-1)]}
function adLow(){return S.diff!=='easy'||!!adState().low}
const AD_OK=.75;
// 每個都練過兩次以上、而且大部分會了，才加新的
const adReady=pool=>pool.every(x=>{const g=BAG.g[x];return g&&g.s>=2})&&covRate(pool)>=AD_OK&&!pool.some(x=>glWeak(x));
// 檢查要不要加新的；回傳要說的話
function adCheck(){if(S.diff==='hard')return null;const st=adState();const msg=[];const nw=[];
 if(S.diff==='easy'){
  if(st.l<AD_L.length-1&&adReady(letterPool())){const a=adLetN();st.l++;nw.push(...UP.slice(a,adLetN()).split(''));msg.push('今天有新的字母朋友加入喔！')}
  else if(st.l>=AD_L.length-1&&!st.low&&adReady(letterPool())){st.low=1;nw.push('a–z');msg.push('今天開始，也要認識小寫字母喔！')}}
 const zk=adZKey(),zi=Math.max(st[zk],adZyBase());
 if(zi<AD_Z.length-1&&adReady(zyPool().split(''))){const a=adZyN();st[zk]=zi+1;nw.push(...ZY_ALL.slice(a,adZyN()).split(''));msg.push('今天有新的注音朋友加入喔！')}
 if(!msg.length)return null;saveBag();return {msg,nw}}

const _stageAd=SCREENS.stage;

function questCard(q){const C=CHAPTERS[q.ch],L=C.levels[q.lv];const sk=q.ch+'-'+q.lv,st=S.stars[sk]||0;
 const ov=overlay(screen,`<div class="card questcard"><h2>今天的小任務</h2><div class="qrow"><span class="qic">${(WORLD[q.ch]&&WORLD[q.ch].ic)?WORLD[q.ch].ic():''}</span><span class="qani">${animal(L.helper)}</span></div>
  <p><b>第${CHN(q.ch)}章「${C.name}」</b><br>第 ${q.lv+1} 關「${L.name}」</p><p class="rstars">${'★'.repeat(Math.min(3,st))}<i>${'★'.repeat(3-Math.min(3,st))}</i></p><p class="small">再玩一次這一關，完成了多送 3 顆寶石！</p>
  <div class="row"><button class="btn" id="qgo">出發！</button><button class="btn2 small" id="qno">下次再說</button></div></div>`);
 say(['今天的小任務：回到這個地方，再玩一次這一關！完成了，會多送你三顆寶石喔！']);
 $('#qno',ov).onclick=()=>{hush();ov.remove()};
 $('#qgo',ov).onclick=()=>{hush();ov.remove();if(cont()&&S.ch!==q.ch){V2.qret=S.ch;save2()}setCh(q.ch);if(q.ch<S.chDone&&!(S.prog>q.lv))S.prog=NL;S.walkFrom=null;save();startLevel(q.lv)}}

function profSave(){try{window.__rawLS.set('pp4prof',JSON.stringify(window.PROF))}catch(e){}}
function profKidName(k){try{const raw=window.__rawLS.get(window.__pkey('pp4',k.id,k.hero||'princess'));const o=raw?JSON.parse(raw):null;return (o&&o.name)||''}catch(e){return ''}}
function profGo(id,hero){const P=window.PROF;P.cur=id;const k=P.kids.find(x=>x.id===id);
 if(k&&hero&&hero!==(k.hero||'princess')){const key=window.__pkey('pp4',id,hero);if(!window.__rawLS.get(key))try{const keep={name:S.name,sound:S.sound,music:S.music,voice:S.voice,vo:S.vo,rest:S.rest,lite:S.lite,liteUser:S.liteUser,diff:S.diff};window.__rawLS.set(key,JSON.stringify(keep))}catch(e){}k.hero=hero}
 profSave();hush();setTimeout(()=>location.reload(),150)}
function profAdd(){const P=window.PROF;let n=Math.max(P.next||2,2);while(P.kids.some(k=>k.id==='c'+n))n++;P.next=n+1;const id='c'+n;P.kids.push({id,hero:'princess'});
 // 新的小朋友沿用這台裝置的聲音、音樂、休息、流暢設定，不帶進度
 try{const keep={sound:S.sound,music:S.music,voice:S.voice,vo:S.vo,rest:S.rest,lite:S.lite,liteUser:S.liteUser,diff:S.diff};window.__rawLS.set(window.__pkey('pp4',id,'princess'),JSON.stringify(keep))}catch(e){}
 profGo(id)}
async function profDel(id){const P=window.PROF;const k=P.kids.find(x=>x.id===id);if(!k||id===P.cur)return;
 const nm=profKidName(k)||'這位小朋友';const yes=await confirmBox(`刪除「${nm}」的紀錄？`,'衣服、寶石、進度和學習紀錄都會刪掉，找不回來喔。','刪除');if(!yes)return;
 for(const h of ['princess','prince'])window.__rawLS.del(window.__pkey('pp4',id,h));
 for(const key of ['pp4v2','pp4bag','pp4paint','pp4time'])window.__rawLS.del(window.__pkey(key,id));
 try{const sx=id==='c1'?'':'@'+id;indexedDB.deleteDatabase('pp4rec'+sx);indexedDB.deleteDatabase('starlight-album'+sx)}catch(e){}
 P.kids=P.kids.filter(x=>x.id!==id);profSave();toast('已經刪除');parentPanel()}
const _ppProf=parentPanel;

 d.innerHTML=`<span class="lab">小朋友</span><div class="proflist">${P.kids.map(k=>{const nm=profKidName(k)||(k.id===cur?(S.name||'還沒取名字'):'還沒取名字');return `<div class="profrow${k.id===cur?' cur':''}"><span class="pfn">${k.hero==='prince'?'👦':'👧'} <b>${nm.replace(/</g,'')}</b>${k.id===cur?' <i>（現在）</i>':''}</span>${k.id===cur?'':`<button class="btn2 small" data-pgo="${k.id}">切換</button><button class="btn2 small pdel" data-pdel="${k.id}">刪除</button>`}</div>`}).join('')}</div>
  <div class="vrow">${P.kids.length<6?'<button class="btn2 small" id="padd">新增小朋友</button>':''}</div>
  ${PRINCE_READY?`<span class="lab">主角</span><div class="seg"><button data-hero="princess" aria-pressed="${HERO==='princess'}">小公\u2060主</button><button data-hero="prince" aria-pressed="${HERO==='prince'}">小王子</button></div><p class="small">換主角時，兩邊的衣服、寶石和進度會分開保存；注音、字母的學習紀錄是同一份。</p>`:''}
  <p class="small">每個小朋友有自己的衣服、寶石、進度和學習紀錄。</p>`;
 const first=card.querySelector('.lab');const box=first&&first.closest('.card > div');if(box)box.after(d);else card.appendChild(d);
 $$('[data-pgo]',d).forEach(b=>b.onclick=()=>profGo(b.dataset.pgo));
 $$('[data-pdel]',d).forEach(b=>b.onclick=()=>profDel(b.dataset.pdel));
 const ad=$('#padd',d);if(ad)ad.onclick=async()=>{const yes=await confirmBox('新增一位小朋友？','新增後會切換過去，從頭開始冒險。原本的紀錄都會保留。','新增');if(yes)profAdd()};

}catch(e){}return r};
