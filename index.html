<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>星光公主大冒險</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#121A44">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="星光公主">

<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&display=swap" onload="this.onload=null;this.rel='stylesheet'">
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Huninn&display=swap" onload="this.onload=null;this.rel='stylesheet'">
<style>
[hidden]{display:none!important}
:root{
  --sky1:#121A44; --sky2:#2A2466; --sky3:#4A3282;
  --glass:rgba(38,32,94,.72); --glass2:rgba(24,20,70,.55);
  --gold:#FFD98A; --gold2:#FFC24D; --goldline:rgba(255,217,138,.7);
  --text:#FFF8EC; --text2:#D4CCF4; --deep:#2A2266;
  --cjk:"Huninn","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  --latin:"Baloo 2","Arial Rounded MT Bold","Nunito",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0}
body{background:linear-gradient(180deg,var(--sky1),var(--sky2) 60%,var(--sky3));color:var(--text);font-family:var(--cjk);overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:manipulation}
#sky{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
#sky svg{position:absolute;inset:0;width:100%;height:100%}
.twl{position:absolute;inset:0;will-change:opacity;animation:twl 3.2s ease-in-out infinite}.twl.b{animation-duration:4.1s;animation-delay:1.3s}
@keyframes twl{50%{opacity:.2}}
.lite .twl{animation:none}
.shoot{position:absolute;top:12%;left:70%;width:140px;height:2px;background:linear-gradient(90deg,rgba(255,255,255,0),#fff);border-radius:2px;opacity:0;transform:rotate(-24deg);animation:shoot 11s linear infinite 3s}
@keyframes shoot{0%{opacity:0;transform:translate(0,0) rotate(-24deg)}2%{opacity:1}8%{opacity:0;transform:translate(-420px,190px) rotate(-24deg)}100%{opacity:0}}
#app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;max-width:1120px;margin:0 auto;padding-inline:16px;padding-block:10px;box-sizing:border-box;gap:10px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;touch-action:manipulation}
button:focus-visible,.node:focus-visible{outline:3px solid var(--gold);outline-offset:3px}

/* top bar */
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px}
.gems{display:flex;align-items:center;gap:3px;background:var(--glass);border:2px solid var(--goldline);border-radius:999px;padding:4px 12px}
.gems svg{width:28px;height:28px}
.icons{display:flex;gap:8px}
.ibtn{width:46px;height:46px;border-radius:50%;background:var(--glass);border:2px solid var(--goldline);display:grid;place-items:center}
.ibtn svg{width:22px;height:22px}
.ibtn.off{opacity:.5}
@media (max-width:480px){.gems{padding:3px 8px;gap:1px}.gems svg{width:22px;height:22px}.ibtn{width:40px;height:40px}.icons{gap:5px}}

#screen{flex:1;min-height:0;position:relative;transition:opacity .26s ease,transform .26s ease}
#screen.out{opacity:0;transform:scale(.96)}
#screen.in{animation:scIn .5s ease}
@keyframes scIn{from{opacity:0;transform:scale(1.04)}}

/* buttons */
.btn{background:linear-gradient(180deg,#FFF0B8,#FFC24D);color:#3A2A6A;font-size:clamp(22px,3.2vw,30px);padding:.32em 1.4em .38em;border-radius:999px;box-shadow:0 6px 0 #B97A1A,0 0 26px rgba(255,200,80,.45);letter-spacing:.12em}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #B97A1A,0 0 26px rgba(255,200,80,.45)}
.btn2{background:var(--glass);border:2px solid var(--goldline);color:var(--text);font-size:clamp(19px,2.6vw,24px);padding:.3em 1.2em .36em;border-radius:999px;box-shadow:0 5px 0 rgba(0,0,0,.3);letter-spacing:.1em}
.btn2:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.3)}
.lab{font-size:15px;color:var(--text2);letter-spacing:.08em}
.seg{display:inline-flex;border:2px solid var(--goldline);border-radius:999px;overflow:hidden;margin-top:8px;background:var(--glass2)}
.seg button{padding:8px 18px;font-size:16px;color:var(--text2)}
.seg button[aria-pressed="true"]{background:var(--gold);color:var(--deep)}
.vrow{display:flex;gap:10px;align-items:center;margin-top:8px;flex-wrap:wrap}
.vsel{appearance:none;-webkit-appearance:none;background:var(--glass2);color:var(--text);border:2px solid var(--goldline);border-radius:999px;padding:8px 16px;font:inherit;font-size:15px;max-width:240px}
.btn2.small{font-size:16px;padding:.3em 1em}

/* title */
.title{height:100%;display:grid;grid-template-columns:1.05fr 1fr;align-items:center;gap:20px}
.art{position:relative;display:flex;align-items:flex-end;justify-content:center;height:min(66vh,480px)}
.art::after{content:"";position:absolute;bottom:-2%;left:15%;right:15%;height:12%;border-radius:50%;background:radial-gradient(closest-side,rgba(255,220,140,.35),transparent);z-index:-1}
.art .pr{height:100%;width:auto}
.art .uni{height:52%;width:auto;margin-right:-6%}
.panel{display:flex;flex-direction:column;gap:20px;align-items:flex-start}
h1{margin:0;white-space:nowrap;font-size:clamp(40px,6.6vw,74px);letter-spacing:.06em;line-height:1.15;font-weight:400;background:linear-gradient(180deg,#FFF6CC,#FFC24D);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 14px rgba(255,200,90,.45))}
.sub{font-size:clamp(17px,2.3vw,21px);margin:.4em 0 0;color:var(--text2);line-height:1.6}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
@media (max-width:720px){.title{grid-template-columns:1fr;align-content:center;gap:8px}.art{height:34vh}.panel{align-items:center;text-align:center;gap:14px}.row{justify-content:center}}

/* wardrobe */
.ward{height:100%;display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:18px;align-items:stretch}
.stagebox{position:relative;border-radius:28px;background:radial-gradient(ellipse at 50% 90%,rgba(255,220,140,.28),transparent 55%),var(--glass2);border:2px solid var(--goldline);display:flex;align-items:flex-end;justify-content:center;padding:10px;overflow:hidden;min-height:0}
.stagebox .pr{height:96%;width:auto;max-width:100%}
.stagebox .pr.spin{animation:spin .7s ease}
@keyframes spin{40%{transform:scale(1.06) rotate(-4deg)}70%{transform:scale(.98) rotate(3deg)}}
.closet{display:flex;flex-direction:column;gap:12px;min-height:0}
.closet h2{margin:0;font-size:clamp(24px,3.4vw,32px);font-weight:400;color:var(--gold)}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{padding:8px 16px;border-radius:999px;border:2px solid var(--goldline);background:var(--glass2);font-size:18px;color:var(--text2)}
.tab[aria-selected="true"]{background:var(--gold);color:var(--deep)}
.opts{flex:1;min-height:0;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;align-content:start;padding:2px}
.opt{border-radius:20px;background:var(--glass);border:2px solid rgba(255,255,255,.15);padding:8px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:4px}
.opt svg{width:100%;height:auto;aspect-ratio:1;display:block}
.opt span{font-size:15px;color:var(--text2)}
.opt[aria-pressed="true"]{border-color:var(--gold);box-shadow:0 0 18px rgba(255,210,110,.45)}
.opt[aria-pressed="true"] span{color:var(--gold)}
@media (max-width:720px){.ward{grid-template-columns:1fr;grid-template-rows:34% 1fr;gap:10px}.opts{grid-template-columns:repeat(auto-fill,minmax(92px,1fr))}}

/* map */
.map{height:100%;display:flex;flex-direction:column;gap:6px}
.mapsvg{flex:1;min-height:0;width:100%;overflow:hidden;border-radius:24px}
.maprow{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap}
.maptip{margin:0;font-size:clamp(17px,2.4vw,22px);color:var(--text2)}
.maprow .btn2{font-size:17px;padding:.25em 1em .3em}
.node{cursor:pointer;outline:none}
.node.locked{cursor:default}
.node.locked .nbody{opacity:.4}
.nlab{font-family:var(--cjk);font-size:32px;fill:var(--text);stroke:#1A1648;stroke-width:8px;paint-order:stroke;stroke-linejoin:round}
.ring{transform-box:fill-box;transform-origin:center;animation:pulse 1.5s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(1.2);opacity:.2}}
.trail{animation:trail 1.4s linear infinite}
@keyframes trail{to{stroke-dashoffset:-42}}

/* stage */
.stage{height:100%;display:flex;flex-direction:column;border-radius:28px;border:2px solid var(--goldline);background:rgba(24,20,70,.45);position:relative;overflow:hidden;padding:12px 14px;box-sizing:border-box;gap:8px}
.decor{position:absolute;left:0;bottom:0;width:100%;height:34%;pointer-events:none}
.talk{display:flex;align-items:center;gap:18px;position:relative;z-index:1}
.helper{width:clamp(64px,10vw,96px);flex:none;animation:hop 2.4s ease-in-out infinite}
.helper svg{width:100%;height:auto;display:block}
.helper.huh{animation:huh .7s ease}
@keyframes hop{0%,70%,100%{transform:translateY(0)}80%{transform:translateY(-10px)}90%{transform:translateY(0)}}
@keyframes huh{30%{transform:rotate(-12deg)}60%{transform:rotate(8deg)}}
.bubble{flex:1;background:var(--glass);border:2px solid var(--goldline);border-radius:26px;padding:8px 10px 8px 18px;display:flex;align-items:center;gap:12px;position:relative;min-height:64px;animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
.bubble::before{content:"";position:absolute;left:-15px;top:50%;margin-top:-9px;border:9px solid transparent;border-right:14px solid var(--goldline);border-left:0}
.prompt{flex:1;margin:0;font-size:clamp(20px,3vw,28px);line-height:1.4}
.prompt b.ear{display:inline-grid;place-items:center;width:1.25em;height:1.25em;border-radius:50%;background:rgba(255,217,138,.15);border:2px dashed var(--goldline);font-size:1.1em;vertical-align:-.25em;padding-top:.08em;box-sizing:border-box}
.prompt b.kw{font-family:var(--cjk);font-weight:400;font-size:1em;vertical-align:0}
.prompt b{font-family:var(--latin);font-weight:800;font-size:1.45em;color:var(--gold2);line-height:1;vertical-align:-.08em;text-shadow:0 0 12px rgba(255,200,80,.6)}
.speak{width:54px;height:54px;border-radius:50%;background:linear-gradient(180deg,#FFF0B8,#FFC24D);display:grid;place-items:center;flex:none;box-shadow:0 0 16px rgba(255,200,80,.5)}
.speak svg{width:26px;height:26px}
.play{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(12px,3vh,26px);position:relative;z-index:1}
.cast{display:flex;align-items:flex-end;justify-content:space-between;position:relative;z-index:1;height:clamp(84px,19vh,168px)}
.qdots{display:flex;gap:8px;align-self:center}
.qdots i{width:18px;height:18px;border-radius:50%;border:2px solid var(--gold);background:transparent;transition:background .3s,box-shadow .3s}
.qdots i.on{background:var(--gold2);box-shadow:0 0 12px var(--gold2)}
.team{display:flex;align-items:flex-end;height:100%}
.team .pr{height:100%;width:auto}
.team{position:relative}
.pet{height:62%;display:flex;align-items:flex-end;margin-right:-8px}
.pet .uni{height:100%;width:auto}
.pet.petjump{animation:petjump .7s ease}
@keyframes petjump{30%{transform:translateY(-18px) rotate(-6deg)}60%{transform:translateY(0)}75%{transform:translateY(-6px)}}
.team.cast-on .pr{animation:castjump .6s ease}
@keyframes castjump{35%{transform:translateY(-14px) rotate(-3deg)}}

/* tiles */
.tiles{display:flex;gap:clamp(12px,3vw,26px);flex-wrap:wrap;justify-content:center}
.tile{width:clamp(76px,14.5vw,116px);aspect-ratio:1;max-width:100%;border-radius:26px;border:2px solid rgba(255,255,255,.75);font-family:var(--latin);font-weight:800;font-size:clamp(42px,8vw,68px);color:#fff;display:grid;place-items:center;line-height:1;padding-top:.1em;box-sizing:border-box;background:linear-gradient(160deg,var(--t1),var(--t2) 72%);box-shadow:0 6px 0 rgba(0,0,0,.3),0 0 22px var(--t2);text-shadow:0 2px 0 rgba(0,0,0,.22);animation:pop .45s cubic-bezier(.3,1.6,.5,1) backwards;animation-delay:var(--dl,0s)}
.tile:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.3),0 0 22px var(--t2)}
.c0{--t1:#FFC2E0;--t2:#FF5FA6}.c1{--t1:#B8F4FB;--t2:#22B3D2}.c2{--t1:#DDCFFF;--t2:#8563EE}.c3{--t1:#FFF2B0;--t2:#F0A92A}.c4{--t1:#BDF7D8;--t2:#2DBF80}
.tile.gone{visibility:hidden}

/* butterflies */
.flutter{display:flex;gap:clamp(4px,3vw,32px);flex-wrap:wrap;justify-content:center}
.bfly{position:relative;width:clamp(92px,19vw,160px);aspect-ratio:1.1;animation:flyin 1s cubic-bezier(.2,.8,.3,1) backwards;animation-delay:var(--dl)}
@keyframes flyin{from{transform:translate(var(--fx),var(--fy)) rotate(var(--fr)) scale(.4);opacity:0}}
.bfly .fl{position:absolute;inset:0;animation:float 2.8s ease-in-out infinite;animation-delay:var(--dl)}
@keyframes float{50%{transform:translateY(-12px) rotate(2deg)}}
.bfly svg{width:100%;height:100%;display:block;filter:drop-shadow(0 0 10px var(--w))}
.bfly span{position:absolute;left:50%;top:54%;transform:translate(-50%,-50%);width:48%;aspect-ratio:1;border-radius:50%;background:#FFFDF5;display:grid;place-items:center;font-family:var(--latin);font-weight:800;font-size:clamp(34px,6.4vw,58px);line-height:1;padding-top:.12em;box-sizing:border-box;color:var(--deep);box-shadow:0 0 14px rgba(255,255,255,.6)}
.bfly.win .fl{animation:winfly 1.2s ease forwards}
@keyframes winfly{30%{transform:scale(1.25)}100%{transform:translateY(-30px) scale(1.15)}}

/* countable items */
.riverwrap{position:relative;width:100%;max-width:840px;padding-inline:58px;box-sizing:border-box}
.river{border-radius:36px;padding:clamp(14px,3vh,26px) 12px;background:linear-gradient(180deg,#3148A8,#23307E);border:2px solid rgba(160,220,255,.45);box-shadow:inset 0 0 30px rgba(120,200,255,.25);position:relative;overflow:hidden}
.river::before{content:"";position:absolute;inset:-50% -10%;background:repeating-linear-gradient(170deg,transparent 0 26px,rgba(170,230,255,.12) 26px 30px);animation:flow 5s linear infinite}
@keyframes flow{to{transform:translateX(60px)}}
.frog{position:absolute;left:0;top:50%;width:56px;margin-top:-28px;z-index:2}
.frog svg{width:100%;height:auto;display:block}
.bank{position:absolute;right:4px;top:50%;margin-top:-18px;width:44px;height:36px;border-radius:50%;background:radial-gradient(#6DD38E,#2E8F5A);box-shadow:0 0 12px rgba(120,240,160,.5)}
.items{display:flex;flex-wrap:wrap;justify-content:center;gap:clamp(6px,1.4vw,14px);position:relative}
.it{position:relative;width:clamp(46px,8.5vw,74px);aspect-ratio:1;transition:transform .2s,opacity .6s,filter .6s}
.it svg{width:100%;height:100%;display:block}
.it.counted{transform:scale(1.12);filter:drop-shadow(0 0 10px #FFF3B0)}
.it[data-n]::after{content:attr(data-n);position:absolute;top:-8px;right:-8px;background:var(--gold2);color:var(--deep);font-family:var(--latin);font-weight:800;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:16px;line-height:1;padding-top:3px;box-sizing:border-box}
.drop{animation:drop .6s cubic-bezier(.3,1.4,.5,1) backwards;animation-delay:var(--dl)}
@keyframes drop{from{transform:translateY(-70px) scale(.6);opacity:0}}
.grow{animation:grow .6s cubic-bezier(.3,1.6,.5,1) backwards;animation-delay:var(--dl);transform-origin:50% 100%}
@keyframes grow{from{transform:scale(0)}}
.floatin{animation:floatin .9s cubic-bezier(.2,.9,.3,1.2) backwards;animation-delay:var(--dl)}
@keyframes floatin{from{transform:translate(120px,-60px) rotate(40deg) scale(.4);opacity:0}}
.dance{animation:dance2 .5s ease-in-out infinite alternate}
@keyframes dance2{to{transform:translateY(-6px) rotate(6deg)}}
.it.bite{animation:bite .7s ease forwards;pointer-events:none}
@keyframes bite{20%{transform:rotate(-12deg) scale(1.05)}40%{transform:rotate(10deg)}100%{transform:scale(.7);opacity:.2;filter:grayscale(1)}}
.hang{animation:hang 2.6s ease-in-out infinite;transform-origin:50% 0;animation-delay:var(--dl)}
@keyframes hang{50%{transform:rotate(5deg)}}

.eq{display:flex;align-items:center;justify-content:center;gap:clamp(8px,2vw,18px);flex-wrap:wrap}
.grp{background:var(--glass);border:2px solid var(--goldline);border-radius:26px;padding:10px 12px;display:flex;flex-direction:column;align-items:center;gap:6px}
.grp .items{max-width:clamp(130px,30vw,300px)}
.grp .it{width:clamp(36px,6vw,54px)}
.grp em{font-style:normal;font-family:var(--latin);font-weight:800;font-size:clamp(30px,5vw,44px);line-height:1;color:var(--gold)}
.op{font-family:var(--latin);font-size:clamp(40px,6vw,60px);font-weight:800;line-height:1;color:var(--text)}
.qbox{width:clamp(70px,12vw,100px);aspect-ratio:1;border:3px dashed var(--goldline);border-radius:24px;display:grid;place-items:center;font-family:var(--latin);font-weight:800;font-size:clamp(40px,7vw,64px);background:var(--glass2);line-height:1;padding-top:.1em;box-sizing:border-box;color:var(--gold)}
.qbox.solved{border-style:solid;background:linear-gradient(180deg,#FFF0B8,#FFC24D);color:var(--deep);animation:pop .45s cubic-bezier(.3,1.6,.5,1);box-shadow:0 0 22px rgba(255,200,80,.6)}
.eqtext{font-family:var(--latin);font-weight:800;font-size:clamp(36px,6vw,56px);display:flex;align-items:center;gap:.3em;line-height:1}
.eqtext .qbox{width:clamp(60px,10vw,86px);font-size:inherit}
.treebox{position:relative;background:var(--glass);border:2px solid var(--goldline);border-radius:34px;padding:16px 18px 16px 76px;max-width:100%;box-sizing:border-box}
.treebox .sq{position:absolute;left:8px;bottom:6px;width:62px}
.treebox .sq svg{width:100%;height:auto;display:block}
.sq.chomp{animation:chomp .35s ease}
@keyframes chomp{50%{transform:scale(1.15,.9) translateY(4px)}}

/* gate */
.gate{position:relative;width:min(88%,460px);border-radius:230px 230px 18px 18px/150px 150px 18px 18px;padding:84px 18px 26px;box-sizing:border-box;border:3px solid var(--gold);background:#FFF3C4;overflow:hidden;box-shadow:0 0 30px rgba(255,210,110,.35)}
.gate .light{position:absolute;inset:0;background:radial-gradient(circle at 50% 60%,#FFFBEA,#FFE08A 45%,#F7B84B)}
.leaf{position:absolute;top:0;bottom:0;width:50%;background:linear-gradient(180deg,#6A5AD0,#3B2F92);transition:transform 1.1s cubic-bezier(.6,0,.3,1)}
.leaf.l{left:0;transform-origin:0 50%;border-right:2px solid var(--gold)}
.leaf.r{right:0;transform-origin:100% 50%;border-left:2px solid var(--gold)}
.leaf::after{content:"";position:absolute;top:86%;width:10px;height:10px;border-radius:50%;background:var(--gold)}
.leaf.l::after{right:10px}.leaf.r::after{left:10px}
.gate .keystar{position:absolute;top:14px;left:50%;transform:translateX(-50%);width:44px;z-index:2;transition:opacity .4s}
.gate.open .leaf.l,.gate.open .leaf.r{transform:scaleX(0)}
.gate.open .slots,.gate.open .keystar{opacity:0;transition:opacity .3s}
.slots{position:relative;z-index:2;display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.slots i{width:clamp(56px,10vw,84px);aspect-ratio:1;border:3px dashed var(--goldline);border-radius:22px;display:grid;place-items:center;font-style:normal;font-family:var(--latin);font-weight:800;font-size:clamp(32px,6vw,52px);background:rgba(20,16,60,.4);line-height:1;padding-top:.1em;box-sizing:border-box;color:var(--deep)}
.slots i.fill{background:linear-gradient(180deg,#FFF0B8,#FFC24D);border-style:solid;border-color:#fff;box-shadow:0 0 18px rgba(255,210,110,.7)}

/* feedback */
.right{animation:yay .6s}
@keyframes yay{30%{transform:scale(1.18) rotate(-4deg)}60%{transform:scale(1.05) rotate(3deg)}}
.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
@keyframes pop{from{transform:scale(.6);opacity:0}}

/* overlays */
.overlay{position:absolute;inset:0;background:rgba(10,8,40,.55);display:grid;place-items:center;z-index:5;padding:16px;border-radius:28px}
.card{background:linear-gradient(180deg,rgba(60,50,140,.95),rgba(34,28,94,.95));border:2px solid var(--gold);border-radius:32px;padding:22px 26px;max-width:520px;width:100%;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;animation:pop .5s cubic-bezier(.3,1.6,.5,1);box-shadow:0 0 40px rgba(255,210,110,.25)}
.card h2{margin:0;font-size:clamp(26px,4vw,34px);font-weight:400;color:var(--gold)}
.card p{margin:0;font-size:clamp(19px,2.6vw,23px);line-height:1.55}
.card .face{width:clamp(96px,16vw,130px);animation:bounceIn .8s cubic-bezier(.3,1.6,.5,1)}
@keyframes bounceIn{from{transform:translateY(-80px) scale(.5);opacity:0}}
.card .face svg{width:100%;height:auto;display:block}
.gembig{width:clamp(100px,16vw,130px);animation:twirl 1.2s ease;filter:drop-shadow(0 0 18px var(--gc))}
.gembig svg{width:100%;height:auto;display:block}
@keyframes twirl{from{transform:scale(.2) rotate(-240deg)}}
.crownrow{display:flex;gap:8px}.crownrow svg{width:40px;height:40px}
.flygem{position:fixed;z-index:30;pointer-events:none}
.flygem svg{width:100%;height:100%}

/* ending */
.ending{height:100%;border-radius:28px;border:2px solid var(--goldline);background:rgba(24,20,70,.35);position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:12px;padding:16px 16px 22px;box-sizing:border-box}
.endcastle{position:absolute;width:min(66%,470px);height:auto;left:50%;transform:translateX(-50%);top:2%}
.trio{display:flex;align-items:flex-end;height:min(40vh,310px);position:relative;z-index:1;gap:2%}
.trio > div{height:100%;display:flex;align-items:flex-end}
.trio svg{height:100%;width:auto}
.trio .u{height:64%}
.walkin{animation:walkin 1.8s ease-out backwards}
@keyframes walkin{from{transform:translateX(-60vw)}}
.fromdoor{animation:fromdoor 1.4s ease-out backwards;animation-delay:2.6s}
@keyframes fromdoor{from{transform:translateY(-22vh) scale(.35);opacity:0}}
.jig{animation:jig .9s ease-in-out infinite alternate}
@keyframes jig{to{transform:translateY(-12px) rotate(2deg)}}
.endh{margin:0;font-size:clamp(32px,6vw,54px);position:relative;z-index:1;letter-spacing:.06em;font-weight:400;color:var(--gold);text-shadow:0 0 18px rgba(255,200,80,.6);animation:pop .6s cubic-bezier(.3,1.6,.5,1) backwards 3.6s}
.endbtns{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;position:relative;z-index:1;animation:pop .6s ease backwards 4.2s}
.heart{position:absolute;bottom:20%;z-index:2;pointer-events:none;animation:hrise 4s ease-in forwards}
@keyframes hrise{from{transform:translateY(0) scale(.5);opacity:0}15%{opacity:1}to{transform:translateY(-55vh) scale(1.1);opacity:0}}

/* svg internal animation */
.tw{animation:tw 2.4s ease-in-out infinite}
@keyframes tw{50%{opacity:.25}}
.blink{animation:blink 4.6s infinite}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
.sway{transform-origin:60px 28px;animation:sway 4s ease-in-out infinite}
@keyframes sway{50%{transform:rotate(1.6deg)}}
.breathe{transform-origin:60px 168px;animation:breathe 3.2s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.012,.992)}}
.tail{transform-origin:22px 66px;animation:tailw 1.8s ease-in-out infinite}
@keyframes tailw{50%{transform:rotate(-12deg)}}
.nod{transform-origin:70px 66px;animation:nod 3s ease-in-out infinite}
@keyframes nod{50%{transform:rotate(4deg)}}
.wings{transform-origin:55px 50px;animation:flap .3s ease-in-out infinite alternate}
@keyframes flap{to{transform:scaleX(.7)}}


/* v3 additions */
.lefty{display:flex;align-items:center;gap:8px;min-width:0}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--glass);border:2px solid var(--goldline);border-radius:999px;padding:4px 12px 4px 8px;font-size:16px;color:var(--text);white-space:nowrap}
.pill svg{width:24px;height:24px}
.pill b{font-family:var(--latin);font-weight:800;font-size:19px;color:var(--gold);line-height:1;padding-top:2px}
.pbtn{padding:6px 14px;font-size:15px;color:var(--text2)}
@media (max-width:480px){#btnMusic{display:none}.gems svg{width:19px;height:19px}.pill{padding:3px 8px 3px 6px}.pill svg{width:20px;height:20px}}
.small{font-size:15px!important;color:var(--text2)}
.gold{color:var(--gold);font-family:var(--latin);font-size:1.2em}
.chead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.opt{position:relative}
.opt.locked svg{opacity:.55;filter:saturate(.6)}
.opt .badge{position:absolute;top:6px;left:6px;z-index:1;font-style:normal;font-size:12px;background:linear-gradient(180deg,#FFF0B8,#FFC24D);color:var(--deep);border-radius:999px;padding:1px 8px;box-shadow:0 0 10px rgba(255,200,80,.6)}
.opt.prem{border-color:rgba(255,217,138,.45);background:linear-gradient(180deg,rgba(80,60,150,.8),rgba(38,32,94,.8))}
.opt .price{position:absolute;top:6px;right:6px;font-style:normal;display:flex;align-items:center;gap:2px;background:rgba(10,8,40,.75);border-radius:999px;padding:2px 8px 2px 4px;font-family:var(--latin);font-weight:800;color:var(--gold);font-size:15px}
.opt .price svg{width:16px;height:16px;aspect-ratio:auto}
.opt small{font-size:12px;color:var(--text2)}
.card.left{align-items:stretch;text-align:left;gap:16px}
.card.left .btn{align-self:center}
.card .face.big{width:clamp(120px,22vw,170px)}
.card .face.spin{animation:spin .8s ease}
.earn{display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap}
.earn svg{width:30px;height:30px}.earn b{font-family:var(--latin);font-size:28px;color:var(--gold)}
.gifts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
.gift{border-radius:20px;background:rgba(255,255,255,.08);border:2px solid var(--goldline);padding:8px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;animation:pop .5s cubic-bezier(.3,1.6,.5,1) backwards}
.gift:nth-child(2){animation-delay:.12s}.gift:nth-child(3){animation-delay:.24s}
.gift svg{width:100%;height:auto;aspect-ratio:1;display:block}
.gift span{font-size:15px;color:var(--gold)}
.petbub{position:absolute;right:12%;bottom:100%;margin-bottom:8px;max-width:min(320px,70vw);background:#FFFDF5;color:var(--deep);border-radius:20px;padding:10px 14px;font-size:clamp(16px,2.2vw,19px);line-height:1.45;box-shadow:0 0 22px rgba(255,210,110,.5);animation:pop .4s cubic-bezier(.3,1.6,.5,1);z-index:3;white-space:normal;width:max-content}
.petbub::after{content:"";position:absolute;right:26px;top:100%;border:9px solid transparent;border-top-color:#FFFDF5}
.hintglow{animation:hglow 1s ease-in-out infinite!important}
@keyframes hglow{50%{filter:drop-shadow(0 0 22px #FFF3B0) brightness(1.25);transform:scale(1.1)}}
.bal{position:relative;width:clamp(84px,16vw,136px);aspect-ratio:.77;animation:rise 1.2s cubic-bezier(.2,.8,.3,1) backwards;animation-delay:var(--dl)}
@keyframes rise{from{transform:translateY(60vh);opacity:0}}
.bal .fl{position:absolute;inset:0;animation:float 3.2s ease-in-out infinite;animation-delay:var(--dl)}
.bal svg{width:100%;height:100%;display:block;filter:drop-shadow(0 0 12px var(--w))}
.bal span{position:absolute;left:50%;top:37%;transform:translate(-50%,-50%);font-size:clamp(40px,7.5vw,68px);color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.25),0 0 12px rgba(255,255,255,.6);line-height:1}
.bal.win .fl{animation:winfly 1.2s ease forwards}
.zy{font-family:"Huninn","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif!important;font-weight:400!important}
.tile.zyt{font-family:var(--cjk);font-weight:400}
.slots i.zy{font-family:var(--cjk);font-weight:400}
.tile.long{font-size:clamp(34px,6.2vw,54px)}
.tile.xl{font-size:clamp(26px,5vw,42px)}
.tens{display:flex;gap:6px;align-items:flex-end;justify-content:center;flex-wrap:wrap;max-width:min(420px,80vw)}
.rod{display:block;width:clamp(12px,1.8vw,16px);height:clamp(70px,13vh,110px);border-radius:5px;background:repeating-linear-gradient(180deg,#FFE9A0 0 8.5%,#E0A92A 8.5% 10%);box-shadow:0 0 10px rgba(255,210,110,.5);position:relative;transition:transform .2s}
.units{display:flex;flex-wrap:wrap-reverse;width:clamp(44px,6vw,56px);gap:4px}
.unit{display:block;width:clamp(12px,1.8vw,15px);aspect-ratio:1;border-radius:4px;background:#9FF3FF;box-shadow:0 0 8px rgba(160,240,255,.6);position:relative;transition:transform .2s}
.rod.counted,.unit.counted{transform:scale(1.15);filter:drop-shadow(0 0 8px #FFF3B0)}
.rod[data-n]::after,.unit[data-n]::after{content:attr(data-n);position:absolute;left:50%;top:-24px;transform:translateX(-50%);background:var(--gold2);color:var(--deep);font-family:var(--latin);font-weight:800;font-size:13px;border-radius:999px;padding:1px 5px;white-space:nowrap}
.river .tens{margin:0 auto}
.treebox .tens{max-width:min(460px,70vw)}
.pwing{transform-origin:60px 92px;animation:pwing 2.2s ease-in-out infinite}
@keyframes pwing{50%{transform:scaleX(.9)}}


/* ===== polish ===== */
button:active{transform:scale(.96)}
.btn2{background:linear-gradient(180deg,rgba(96,80,190,.92),rgba(40,34,100,.92));box-shadow:0 5px 0 rgba(10,8,40,.55),inset 0 2px 0 rgba(255,255,255,.18)}
.btn{box-shadow:0 6px 0 #B97A1A,0 0 26px rgba(255,200,80,.45),inset 0 2px 0 rgba(255,255,255,.6)}
.tile{width:clamp(80px,min(16vw,17vh),150px);font-size:clamp(42px,min(8.4vw,9vh),84px)}
.tile.long{font-size:clamp(34px,min(6.4vw,7vh),64px)}
.tile.xl{font-size:clamp(26px,min(5vw,5.5vh),50px)}
.qcard{width:clamp(108px,min(22vw,25vh),212px)}
.qcard .emo{font-size:clamp(50px,min(10vw,11vh),100px)}
.qcard .emo svg,.sortitem .emo svg,.basket .emo svg,.qhead svg,.book .emo svg,.rslot em svg,.basket .bin svg,.flyemo svg{width:1.05em;height:1.05em;display:block}
.basket .bin i svg{width:24px;height:24px}
.emoji{filter:drop-shadow(0 0 6px rgba(255,255,255,.35))}
.bfly{width:clamp(96px,min(21vw,25vh),210px)}
.bfly span{font-size:clamp(34px,min(6.6vw,8vh),72px)}
.bal{width:clamp(84px,min(17vw,21vh),170px)}
.bal span{font-size:clamp(40px,min(7.6vw,9vh),84px)}
.mazewrap{width:min(84vw,54vh,540px)}
.basket{width:clamp(140px,min(28vw,30vh),260px)}
.clockw{width:min(44vw,32vh,280px)}
/* speak button */
.speak{width:62px;height:62px;position:relative}
.speak::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:3px solid rgba(255,217,138,.6);animation:ring 2.2s ease-out infinite}
@keyframes ring{0%{transform:scale(.9);opacity:.9}100%{transform:scale(1.35);opacity:0}}
.speaking .speak{animation:talkb .35s ease-in-out infinite alternate}
@keyframes talkb{to{transform:scale(1.08)}}
.speak.nudge{animation:nudge .8s ease 2}
@keyframes nudge{30%{transform:scale(1.25) rotate(-8deg)}60%{transform:scale(1.1) rotate(6deg)}}
.speaking .helper svg{animation:talk .22s ease-in-out infinite alternate;transform-origin:50% 90%}
@keyframes talk{to{transform:scale(1.04,.95)}}
.prompt{font-size:clamp(22px,3.2vw,32px)}
/* reactions */
.team.think .pr{animation:think .9s ease}
@keyframes think{30%{transform:rotate(-6deg)}60%{transform:rotate(4deg)}}
.team.think .pet{animation:think .9s ease .1s}
.sleepy{display:inline-block;animation:bob2 3s ease-in-out infinite;filter:saturate(.8)}
/* long press */
.ibtn,.hold{position:relative}
.ibtn.holding::after,.hold.holding::after{content:"";position:absolute;inset:-5px;border-radius:inherit;border:3px solid var(--gold);clip-path:inset(0 100% 0 0);animation:holdfill var(--hold,1.1s) linear forwards}
.ibtn.holding::after{border-radius:50%}
@keyframes holdfill{to{clip-path:inset(0 0 0 0)}}
#toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);z-index:50;background:#FFFDF5;color:var(--deep);padding:10px 18px;border-radius:999px;font-size:17px;opacity:0;pointer-events:none;box-shadow:0 0 20px rgba(255,210,110,.5)}
#toast.show{animation:toast 2.2s ease forwards}
@keyframes toast{10%,80%{opacity:1;transform:translate(-50%,0)}0%{opacity:0;transform:translate(-50%,-10px)}100%{opacity:0}}
/* motes */
.motes{position:absolute;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.motes i{position:absolute;width:6px;height:6px;border-radius:50%;background:var(--mote,#FFE27A);box-shadow:0 0 10px var(--mote,#FFE27A);animation:drift linear infinite;opacity:.8}
@keyframes drift{0%{transform:translate(0,0)}25%{transform:translate(30px,-26px)}50%{transform:translate(-10px,-50px);opacity:.3}75%{transform:translate(-36px,-20px)}100%{transform:translate(0,0)}}
body[data-ch="0"] .stage{background:rgba(14,48,64,.42)}
body[data-ch="1"] .stage{background:rgba(18,34,100,.45)}
body[data-ch="1"]{--mote:#BFE8FF}
/* map extras */
.marrow{animation:arrowb .9s ease-in-out infinite}
@keyframes arrowb{50%{transform:translateX(10px)}}
/* reward header */
.rhead{display:flex;align-items:center;gap:12px;width:100%;justify-content:center;padding-bottom:8px;border-bottom:1px dashed rgba(255,217,138,.35)}
.rhead .rgem{width:54px;animation:twirl 1.2s ease;filter:drop-shadow(0 0 12px var(--gc))}
.rhead .rgem svg{width:100%;height:auto;display:block}
.rhead b{font-weight:400;font-size:clamp(20px,3vw,26px);color:var(--gold);display:block}
.rstars{color:#FFD24D;font-size:22px;letter-spacing:2px}.rstars i{font-style:normal;color:rgba(255,255,255,.2)}
.rhead .earn b{font-size:24px}
.rbody{display:flex;flex-direction:column;align-items:center;gap:12px;width:100%;min-height:120px;justify-content:center}
/* wipe */
#wipe{position:fixed;inset:0;pointer-events:none;z-index:45;display:grid;place-items:center}
#wipe svg{width:40px;height:40px;transform:scale(0)}
#wipe.on svg{animation:wipein .38s ease-in forwards}
#wipe.off svg{animation:wipeout .42s ease-out forwards}
@keyframes wipein{from{transform:scale(0) rotate(0)}to{transform:scale(70) rotate(90deg)}}
@keyframes wipeout{from{transform:scale(70) rotate(90deg)}to{transform:scale(0) rotate(180deg)}}
/* parent report */
.card.left{max-height:92%;overflow:auto}
.report{display:flex;flex-direction:column;gap:6px}
.rrow{display:grid;grid-template-columns:5.5em 1fr 3em;gap:8px;align-items:center;font-size:15px}
.rbar{height:10px;border-radius:9px;background:rgba(255,255,255,.12);overflow:hidden}.rbar i{display:block;height:100%;background:linear-gradient(90deg,#FF8FC8,#FFD98A)}
.rrow b{font-family:var(--latin);color:var(--gold);text-align:right}
.wlist{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.wchip{background:rgba(255,255,255,.1);border-radius:999px;padding:3px 10px;font-size:14px}.wchip b{color:var(--gold);margin-left:4px}
/* lite mode */
.lite .bfly svg,.lite .bal svg,.lite .gembig,.lite .rhead .rgem,.lite .clockw{filter:none!important}
.lite .motes i{box-shadow:none}
.lite .tile{box-shadow:0 6px 0 rgba(0,0,0,.3)}


/* ===== chapter 3 ===== */
.qline{display:flex;align-items:flex-end;gap:clamp(4px,1.4vw,12px);flex-wrap:wrap;justify-content:center;padding:14px 12px;border-radius:24px;background:rgba(255,255,255,.06);border:2px dashed rgba(255,217,138,.35);max-width:96%}
.booth{width:clamp(56px,10vw,90px)}.booth svg{width:100%;height:auto;display:block}
.qp{position:relative;font-size:clamp(42px,min(8vw,9vh),76px);line-height:1;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;transition:transform .2s}
.qp.counted{transform:scale(1.12)}
.qp[data-n]::after{content:attr(data-n);position:absolute;top:-10px;right:-8px;background:var(--gold2);color:var(--deep);font-family:var(--latin);font-weight:800;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:15px;padding-top:2px;box-sizing:border-box}
.qslot{width:clamp(50px,9vw,80px);height:clamp(70px,12vw,110px);border-radius:18px;border:3px dashed var(--gold);color:var(--gold);font-family:var(--latin);font-weight:800;font-size:30px;display:grid;place-items:center;background:rgba(255,217,138,.08)}
.qslot.me{border-style:solid;background:rgba(255,217,138,.18);padding:2px}
.qslot.me svg{height:100%;width:auto}
.tableset{display:flex;flex-direction:column;align-items:center;gap:10px}
.mat{display:grid;grid-template-columns:repeat(3,clamp(76px,min(15vw,15vh),130px));grid-template-rows:repeat(2,clamp(76px,min(15vw,15vh),130px));gap:10px;padding:14px;border-radius:28px;background:linear-gradient(180deg,#F6C8DC,#E89AC0);box-shadow:0 0 24px rgba(255,160,200,.35)}
.mat .tslot[data-v="top"]{grid-column:3;grid-row:1}.mat .tslot[data-v="left"]{grid-column:1;grid-row:2}.mat .plate{grid-column:2;grid-row:2}.mat .tslot[data-v="right"]{grid-column:3;grid-row:2}
.tslot{border-radius:50%;border:3px dashed #8A3A6A;background:rgba(255,255,255,.35);display:grid;place-items:center;font-size:clamp(40px,7vw,64px)}
.tslot.filled{border-style:solid;background:rgba(255,255,255,.6)}
.tslot svg,.plate svg{width:80%;height:80%}
.plate{display:grid;place-items:center}
.thold{display:flex;flex-direction:column;align-items:center;min-height:90px}
.thold .emo{font-size:clamp(50px,9vw,76px);line-height:1.1}.thold .emo svg{width:1.05em;height:1.05em}
.thold .lbl{font-size:18px}
.cookies{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:min(600px,92vw);min-height:60px}
.cookie{width:clamp(44px,8vw,64px);aspect-ratio:1;animation:drop .5s cubic-bezier(.3,1.4,.5,1) backwards;animation-delay:var(--dl)}
.cookie svg{width:100%;height:100%}.cookie.gone{visibility:hidden}
.plates{display:flex;gap:clamp(8px,2vw,18px);flex-wrap:wrap;justify-content:center}
.fplate{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 10px;border-radius:22px;background:rgba(255,255,255,.08);border:2px solid var(--goldline);min-width:clamp(80px,14vw,120px)}
.ff{font-size:clamp(36px,6vw,50px);line-height:1}
.pl{display:flex;flex-wrap:wrap;gap:2px;justify-content:center;min-height:30px;max-width:130px}
.pl i{display:inline-block}.pl i svg{width:32px;height:32px;animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
.dfloor{position:relative;height:clamp(150px,28vh,260px);width:min(90%,420px);display:flex;justify-content:center;align-items:flex-end;border-radius:50% 50% 20px 20px/30% 30% 20px 20px;background:radial-gradient(ellipse at 50% 100%,rgba(255,217,138,.35),transparent 70%)}
.dancer{height:100%}.dancer svg{height:100%;width:auto}
.mv-clap{animation:mvclap .9s ease}.mv-up{animation:mvup .9s ease}.mv-stomp{animation:mvstomp .9s ease}.mv-spin{animation:mvspin .9s ease}
@keyframes mvclap{20%,60%{transform:scale(1.06,.96)}40%,80%{transform:scale(.96,1.04)}}
@keyframes mvup{40%{transform:translateY(-26px) scale(1.04)}}
@keyframes mvstomp{25%,75%{transform:translateY(6px) scale(1.05,.92)}50%{transform:translateY(-8px)}}
@keyframes mvspin{50%{transform:scaleX(-1)}}
.moves{display:flex;gap:clamp(8px,2vw,18px);flex-wrap:wrap;justify-content:center}
.mv{width:clamp(96px,min(17vw,19vh),150px)!important}
.mv[disabled]{opacity:.55}
.mv.lit{opacity:1;border-color:#fff;box-shadow:0 0 28px rgba(255,230,150,.9);transform:scale(1.08)}
.pin{font:inherit;font-size:22px;width:120px;padding:8px 14px;border-radius:14px;border:2px solid var(--goldline);background:var(--glass2);color:var(--text);text-align:center}
.bk{width:100%;box-sizing:border-box;min-height:70px;font-size:12px;font-family:monospace;border-radius:12px;border:2px solid var(--goldline);background:var(--glass2);color:var(--text2);padding:8px;word-break:break-all}


/* home-screen app: keep clear of status bar / notch / home indicator */
@media (display-mode: standalone), (display-mode: fullscreen){
 #app{padding-top:calc(10px + env(safe-area-inset-top,0px));padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));padding-left:calc(16px + env(safe-area-inset-left,0px));padding-right:calc(16px + env(safe-area-inset-right,0px))}
 #toast{top:calc(70px + env(safe-area-inset-top,0px))}
}

}

async function celebrate(el){

guide(){
 const pets=ITEMS.filter(x=>x.slot==='pet'&&owns(x.id));
 const STEPS=[['dress','選一件漂亮的裙子','今天想穿哪一件呢？'],['head','戴上頭飾','皇冠還是蝴蝶結？'],['prop','選一個魔法道具','冒險的時候要帶什麼呢？'],...(pets.length>1?[['pet','誰要陪你去冒險？','選一隻寵物朋友']]:[])];
 let k=0;
 function render(){const [slot,tt,sub]=STEPS[k];
  screen.innerHTML=`<div class="guide"><div class="stagebox" id="pv">${teamHTML()}</div>
   <div class="gside"><div class="gstep"><div class="dots">${STEPS.map((_,j)=>`<i class="${j<=k?'on':''}"></i>`).join('')}</div></div>
   <h2 class="gtitle">第 ${k+1} 步：${tt}</h2><p class="gsub">${sub}</p>
   <div class="gopts">${ITEMS.filter(x=>x.slot===slot&&owns(x.id)).map((it,j)=>`<button class="opt" style="animation-delay:${j*.07}s" data-id="${it.id}" aria-pressed="${S.look[slot]===it.id}">${still(slot==='pet'?petSVG(it.id,S.look.petacc):princess({...S.look,[slot]:it.id},'',VB[slot]))}<span>${it.name}</span></button>`).join('')}</div>
   <div class="gnav">${k>0?'<button class="btn2" id="back">上一步</button>':''}<button class="btn" id="nx">${k<STEPS.length-1?'下一步':'出發！'}</button><button class="btn2 tiny" id="gskip">跳過</button></div></div></div>`;
  say([tt+'。'+sub]);
  $$('.opt').forEach(b=>b.onclick=()=>{S.look[slot]=b.dataset.id;save();$$('.opt').forEach(x=>x.setAttribute('aria-pressed',x===b));
   $('#pv').innerHTML=teamHTML();const pr=$('#pv .pr');if(pr)pr.classList.add('spin','happy');magicRing($('#pv'));burstEl($('#pv'),24);tone(880,0,.15,'triangle',.08);tone(1320,.08,.2,'triangle',.06);say([ITEM[b.dataset.id].name])});
  $('#nx').onclick=()=>{if(k<STEPS.length-1){k++;sfx('pop');render()}else go('map',S.prog===0?true:undefined)};

wardrobe(){

  <div class="closet"><div class="chead"><h2>換裝間</h2><button class="pill pbtn" id="wardhelp" aria-label="換衣服教學">？ 教學</button><span class="pill" id="wbag"></span></div>

  <div class="opts" id="opts"></div><div class="row"><button class="btn" id="done">穿好了！</button></div></div></div>`;

 const TC=new Map();const thumb=it=>{const k=it.id+'|'+JSON.stringify(S.look);if(TC.has(k))return TC.get(k);if(TC.size>400)TC.clear();const v=thumb0(it);TC.set(k,v);return v};
 const thumb0=it=>still(PETSLOTS.includes(it.slot)?petSVG(it.slot==='pet'?it.id:(PETANI[S.look.pet]?'unicorn':S.look.pet),it.slot==='petacc'?it.id:S.look.petacc):princess({...S.look,[it.slot]:it.id},'',VB[it.slot]));
 function opts(){

  const LI=list(),tok=(opts.tok=(opts.tok||0)+1);

   return `<button class="opt${have?'':' locked'}${it.premium?' prem':''}" data-id="${it.id}" aria-pressed="${worn}">${it.premium?'<i class="badge">高級</i>':''}${ix<12?thumb(it):'<i class="thph"></i>'}<span>${it.name}</span>${have||it.chapter?'':`<em class="price">${gem(WALLET_GEM)}${it.price}</em>`}${!have&&it.chapter?`<small>第${'一二三四五六七八九十'[it.chapter-1]}章大獎</small>`:!have&&(it.reward||it.petgift||it.box)?'<small>闖關禮物</small>':''}</button>`}).join('');
  {const btns=$$('#opts .opt');let j=12;const fill=()=>{if(tok!==opts.tok)return;const end=Math.min(j+6,btns.length);for(;j<end;j++){const ph=btns[j].querySelector('.thph');if(ph)ph.outerHTML=thumb(ITEM[btns[j].dataset.id])}if(j<btns.length)setTimeout(fill,20)};if(btns.length>12)setTimeout(fill,40)}
  $$('.opt').forEach(b=>b.onclick=()=>{const it=ITEM[b.dataset.id];
   if(!owns(it.id))return buy(it);
   if(OPTIONAL.includes(it.slot)&&S.look[it.slot]===it.id)S.look[it.slot]='';else S.look[it.slot]=it.id;
   save();opts();refresh(true);burstEl($('#pv'),22);tone(880,0,.15,'triangle',.08);tone(1320,.08,.2,'triangle',.06);
   say([S.look[it.slot]?it.name:'拿下來了'])})}
 function buy(it){

  const enough=S.wallet>=it.price;

   <p>${enough?`要用 <b class="gold">${it.price}</b> 顆寶石換嗎？`:`還差 <b class="gold">${it.price-S.wallet}</b> 顆寶石。去闖關收集寶石吧！`}</p>

function longPress(btn,act,ms=1100,tip){btn.onclick=null;let t=0;
 const start=e=>{e.preventDefault();btn.classList.add('holding');btn.style.setProperty('--hold',ms+'ms');t=setTimeout(()=>{btn.classList.remove('holding');act()},ms)};
 const end=()=>{if(t){clearTimeout(t);t=0}if(btn.classList.contains('holding')){btn.classList.remove('holding');if(tip)toast(tip)}};
 btn.addEventListener('pointerdown',start);['pointerup','pointerleave','pointercancel'].forEach(ev=>btn.addEventListener(ev,end))}
function toast(msg){let t=$('#toast');if(!t){t=document.createElement('div');t.id='toast';document.body.appendChild(t)}t.textContent=msg;t.classList.remove('show');void t.offsetWidth;t.classList.add('show')}

 ['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,()=>{if(S.screen!=='stage')return;if(t){clearTimeout(t);t=0;b.classList.remove('holding');toast('要長按才會離開這一關喔')}}));
