# 星光小冒險：只處理 App 預覽影片（不動其他上架資料）
# video 填 none＝拿掉影片；填檔案路徑＝換成那支影片
name: App 預覽影片
on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本（例如 1.6）'
        default: '1.7'
      video:
        description: '影片路徑，或 none 拿掉影片'
        default: 'none'
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: 處理 App 預覽影片
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          VER: ${{ inputs.version }}
          VIDEO: ${{ inputs.video }}
        run: |
          python3 -m pip install -q pyjwt cryptography
          python3 app/ci_appreview.py "$VER" "$VIDEO" 00:00:01:00
