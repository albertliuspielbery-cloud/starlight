# 星光小冒險 iOS App：在雲端的 iPhone／iPad 模擬器實際打開 App，自動走過主要畫面
# 結果（截圖、紀錄）放到 selftest-results 分支，不會影響網站
name: iOS 模擬器自我測試
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['app/selftest.js', '.github/workflows/ios-selftest.yml']
permissions:
  contents: write
jobs:
  selftest:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 安裝 Capacitor
        working-directory: app
        run: npm ci
      - name: 做 App 用的網頁（加上自我測試）
        working-directory: app
        run: SELFTEST=1 python3 mkapp.py
      - name: 同步到 iOS 專案
        working-directory: app
        run: npx cap sync ios
      - name: 測試版允許連到測試機上的小伺服器（只有這次測試用）
        run: /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" -c "Add :NSAppTransportSecurity:NSAllowsLocalNetworking bool true" app/ios/App/App/Info.plist || true
      - name: 開截圖用的小伺服器
        run: |
          mkdir -p results
          cat > "$RUNNER_TEMP/srv.py" <<'PY'
          import http.server,urllib.parse,subprocess,os
          class H(http.server.BaseHTTPRequestHandler):
              def do_GET(self):
                  u=urllib.parse.urlparse(self.path);q=urllib.parse.parse_qs(u.query)
                  cur=open('/tmp/cur.txt').read().split()
                  udid,out=cur[0],cur[1]
                  if u.path=='/shot':
                      n=''.join(c for c in q.get('n',['x'])[0] if c.isalnum() or c in '_-')
                      subprocess.run(['xcrun','simctl','io',udid,'screenshot',f'{out}/{n}.png'],capture_output=True)
                  elif u.path=='/log':
                      open(f'{out}/srvlog.txt','a').write(q.get('m',[''])[0]+'\n')
                  self.send_response(200);self.send_header('Access-Control-Allow-Origin','*');self.end_headers();self.wfile.write(b'ok')
              def log_message(self,*a):pass
          http.server.ThreadingHTTPServer(('127.0.0.1',8765),H).serve_forever()
          PY
          nohup python3 "$RUNNER_TEMP/srv.py" > "$RUNNER_TEMP/srv.log" 2>&1 &
          sleep 1
      - name: 模擬器版本
        working-directory: app/ios/App
        run: |
          set -o pipefail
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/dd" CODE_SIGNING_ALLOWED=NO build | tail -30
      - name: 在 iPhone、iPad 模擬器上跑
        run: |
          set +e
          APP=$(ls -d "$RUNNER_TEMP"/dd/Build/Products/Debug-iphonesimulator/*.app | head -1)
          echo "APP=$APP"
          mkdir -p results
          xcrun simctl list devices available > results/devices.txt
          pick(){ xcrun simctl list devices available -j | python3 -c "
          import json,sys,re
          d=json.load(sys.stdin)['devices'];want=sys.argv[1]
          c=[x for k,v in d.items() if 'iOS' in k for x in v if re.search(want,x['name'])]
          print(c[-1]['udid'] if c else '')" "$1"; }
          run_dev(){ name=$1; udid=$2; out=results/$name; mkdir -p $out
            echo "== $name $udid"
            echo "$udid $PWD/$out" > /tmp/cur.txt
            xcrun simctl boot $udid; xcrun simctl bootstatus $udid -b
            xcrun simctl status_bar $udid override --time 9:41 --batteryState charged --batteryLevel 100 2>/dev/null
            xcrun simctl install $udid "$APP"
            for ph in 1 2 2; do
              grep -qs "PHASE2 DONE" $out/srvlog.txt && [ $ph = 2 ] && continue   # 第二階段偶爾開不起來：沒跑完就再開一次
              : > $out/log$ph.txt
              xcrun simctl launch --console-pty --terminate-running-process $udid tw.starlight.adventure > $out/log$ph.txt 2>&1 &
              LP=$!
              seen=""
              for i in $(seq 1 300); do
                sleep 1
                for s in $(grep -o 'SELFTEST SHOT [0-9a-z]*' $out/log$ph.txt | awk '{print $3}'); do
                  case " $seen " in *" $s "*) ;; *) sleep 1; xcrun simctl io $udid screenshot $out/$s.png >/dev/null 2>&1; seen="$seen $s";; esac
                done
                grep -qs "PHASE$ph DONE" $out/log$ph.txt $out/srvlog.txt && break
              done
              sleep 6; kill $LP 2>/dev/null; xcrun simctl terminate $udid tw.starlight.adventure 2>/dev/null; sleep 2
            done
            xcrun simctl spawn $udid log show --last 15m --style compact --predicate 'eventMessage CONTAINS[c] "WebContent" AND (eventMessage CONTAINS[c] "terminat" OR eventMessage CONTAINS[c] "crash" OR eventMessage CONTAINS[c] "jetsam" OR eventMessage CONTAINS[c] "memory")' 2>/dev/null | tail -60 > $out/webcontent.txt
            if [ -s $out/srvlog.txt ]; then cp $out/srvlog.txt $out/summary.txt; else grep -h "SELFTEST" $out/log1.txt $out/log2.txt | grep -v SHOT > $out/summary.txt; fi
            xcrun simctl shutdown $udid
          }
          IP=$(pick 'iPhone 1[0-9] Pro Max'); [ -z "$IP" ] && IP=$(pick 'iPhone')
          PD=$(pick 'iPad Pro 13'); [ -z "$PD" ] && PD=$(pick 'iPad')
          run_dev iphone $IP
          run_dev ipad $PD
          cat results/*/summary.txt
      - name: 把結果放到 selftest-results 分支
        run: |
          cd results
          git init -q; git checkout -q -b selftest-results
          git config user.name "selftest"; git config user.email "selftest@users.noreply.github.com"
          echo "run ${{ github.run_id }} sha ${{ github.sha }}" > RUN.txt
          git add -A; git commit -q -m "selftest ${{ github.run_id }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" selftest-results
      - name: 有任何一項失敗，這次測試就算失敗
        run: |
          cat results/*/summary.txt
          ! grep -h "FAIL" results/*/summary.txt
          for d in iphone ipad; do grep -q "PHASE2 DONE" results/$d/summary.txt || { echo "$d 沒有跑完第二階段"; exit 1; }; done
