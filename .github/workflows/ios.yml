# 星光小冒險 iOS App：雲端 Mac 打包
# - 平常（app 資料夾有改動時）：只做模擬器版本，確認程式能編譯
# - 手動執行並勾選「上傳」：簽名、打包、上傳到 App Store Connect（TestFlight）
#   需要先在 GitHub → Settings → Secrets 放：ASC_KEY_ID、ASC_ISSUER_ID、ASC_KEY_P8、APPLE_TEAM_ID
name: iOS App
on:
  workflow_dispatch:
    inputs:
      upload:
        description: '簽名並上傳到 App Store Connect（TestFlight）'
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/ios.yml']
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: 用 Xcode 26（App Store 規定要用 iOS 26 SDK 打包）
        run: |
          ls -d /Applications/Xcode*.app
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$X" ] || { echo "::error::這台雲端電腦沒有 Xcode 26"; exit 1; }
          sudo xcode-select -s "$X/Contents/Developer"
          xcodebuild -version
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 安裝 Capacitor
        working-directory: app
        run: npm ci
      - name: 做 App 用的網頁和語音
        working-directory: app
        run: python3 mkapp.py
      - name: 同步到 iOS 專案
        working-directory: app
        run: npx cap sync ios
      - name: 模擬器版本（不簽名）
        if: ${{ !inputs.upload }}
        working-directory: app/ios/App
        run: |
          set -o pipefail
          xcodebuild -project App.xcodeproj -scheme App -configuration Release -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build | tail -80
      - name: 簽名、打包、上傳
        if: ${{ inputs.upload }}
        working-directory: app/ios/App
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -eo pipefail
          KEY="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$KEY"
          SIGN="$RUNNER_TEMP/sign"; KC="$RUNNER_TEMP/ci.keychain-db"
          cleanup(){ rm -rf "$KEY" "$SIGN"; security delete-keychain "$KC" 2>/dev/null || true; }
          trap cleanup EXIT
          # 出錯時把錯誤訊息列成註記（在 Actions 頁面上就看得到，不用下載紀錄）
          note(){ grep -E "error:|Error Domain|No profiles|No Account|requires a provisioning|Signing for" "$1" | grep -v "^note:" | sort -u | head -9 | while IFS= read -r l; do echo "::error::$2: ${l:0:900}"; done; }
          # 1. 用 API 金鑰準備上架用的憑證和描述檔（不需要登記 iPhone）
          python3 -m pip install -q --break-system-packages pyjwt cryptography 2>/dev/null || python3 -m pip install -q pyjwt cryptography
          python3 ../../ci_sign.py "$SIGN"
          PW=$(cat "$SIGN/p12pass")
          security create-keychain -p "$PW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$PW" "$KC"
          security import "$SIGN/dist.p12" -k "$KC" -P "$PW" -T /usr/bin/codesign -T /usr/bin/security -f pkcs12
          security set-key-partition-list -S apple-tool:,apple: -s -k "$PW" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KC"
          # 2. 只在這次雲端打包時，把 App 的 Release 改成用上架憑證
          python3 ../../ci_pbx.py
          BUILD=$(date -u +%Y%m%d%H%M)
          xcodebuild -project App.xcodeproj -scheme App -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" archive \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" OTHER_CODE_SIGN_FLAGS="--keychain $KC" CURRENT_PROJECT_VERSION="$BUILD" > "$RUNNER_TEMP/archive.log" 2>&1 || { tail -80 "$RUNNER_TEMP/archive.log"; note "$RUNNER_TEMP/archive.log" archive; exit 65; }
          tail -20 "$RUNNER_TEMP/archive.log"
          cat > "$RUNNER_TEMP/export.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key><dict><key>tw.starlight.adventure</key><string>Starlight AppStore CI</string></dict>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" -exportOptionsPlist "$RUNNER_TEMP/export.plist" \
            -exportPath "$RUNNER_TEMP/export" -authenticationKeyPath "$KEY" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            > "$RUNNER_TEMP/export.log" 2>&1 || { tail -80 "$RUNNER_TEMP/export.log"; note "$RUNNER_TEMP/export.log" upload; exit 65; }
          tail -30 "$RUNNER_TEMP/export.log"
