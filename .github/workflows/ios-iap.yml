# 星光小冒險：在 App Store Connect 建好「App 內購買項目」（第六～二十章、第二十一～二十五章解鎖）
# 只建商品、不會送審；已經上架的商品不會動。送審時在新版本（1.3）頁面把新的商品加進去
name: App 內購買項目
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  iap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: 建立商品、價格、名稱、截圖
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          python3 -m pip install -q pyjwt cryptography
          python3 app/ci_iap.py app/iap_review.png
